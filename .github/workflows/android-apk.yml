name: Build Android APK

on:
  workflow_dispatch:          # przycisk "Run workflow" w zakładce Actions

permissions:
  contents: write             # potrzebne do utworzenia Release (zakładka Releases)

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # true tylko jeśli dodałeś sekret z keystore (podpisany APK); inaczej APK testowy (debug-signed)
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bootstrap Expo base (only if repo has no package.json)
        run: |
          if [ ! -f package.json ]; then
            npx --yes create-expo-app@latest _base --template blank --no-install
            cp _base/package.json .
            if [ -f _base/index.js ]; then cp _base/index.js .; fi
            rm -rf _base
          fi

      - name: Install dependencies
        run: |
          npm install
          npx expo install expo-location expo-task-manager expo-notifications expo-camera expo-image-picker expo-brightness @react-native-async-storage/async-storage react-native-svg react-native-safe-area-context
          npm install react-native-qrcode-svg jsbarcode

      - name: Create .env (EXPO_PUBLIC_* are embedded in the app = public!)
        run: |
          echo "EXPO_PUBLIC_DEV_TOOLS=${{ vars.EXPO_PUBLIC_DEV_TOOLS }}" >> .env
          echo "EXPO_PUBLIC_OVERPASS_URL=${{ secrets.EXPO_PUBLIC_OVERPASS_URL }}" >> .env

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/*.apk tappass.apk

      # APK trafia do zakładki Releases (nie zajmuje limitu miejsca na artefakty Actions)
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TapPass build ${{ github.run_number }}
          prerelease: true
          files: tappass.apk
