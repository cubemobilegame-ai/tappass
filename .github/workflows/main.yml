          cat > build_storedb.py <<'TAPPASS_EOF'
          # Builds assets/storedb.json: locations of every chain TapPass knows, so the app does not
          # depend on busy public map servers. Source: All the Places (official store locators, CC0),
          # https://www.alltheplaces.xyz  ->  {"Tesco": [lat*1e5, lng*1e5, lat*1e5, lng*1e5, ...], ...}
          import io, json, re, sys, unicodedata, urllib.request, zipfile

          ALIASES = json.load(open(sys.argv[1], encoding='utf-8'))   # list of brand names the app matches
          OUT = sys.argv[2]
          UA = {'User-Agent': 'TapPass-build/1.0 (support@tappass.app)'}

          REGIONS = [  # (lat_min, lat_max, lng_min, lng_max)
              (49.8, 61.0, -10.8, 1.8),      # UK + Ireland
              (49.0, 55.0, 14.1, 24.2),      # Poland (test stores)
              (24.4, 49.5, -125.0, -66.9),   # USA mainland
              (51.0, 72.0, -180.0, -129.0),  # Alaska
              (18.9, 22.3, -160.3, -154.8),  # Hawaii
          ]

          def fold(s):
              s = unicodedata.normalize('NFD', str(s or '').lower())
              s = ''.join(c for c in s if not unicodedata.combining(c)).replace('ł', 'l')
              s = re.sub(r"['’.]", '', s)
              return re.sub(r'\s+', ' ', s).strip()

          FA = {}
          for a in ALIASES:                      # one entry per spelling (Żabka / Zabka fold to the same text)
              if fold(a) not in FA.values(): FA[a] = fold(a)
          ALIASES = list(FA)
          def match(label):
              f = fold(label)
              if not f: return []
              return [a for a, fa in FA.items() if f == fa or f.startswith(fa + ' ') or f.startswith(fa + '-')]

          def inside(lat, lng):
              return any(a <= lat <= b and c <= lng <= d for a, b, c, d in REGIONS)

          def latest_zip():
              html = urllib.request.urlopen(urllib.request.Request('https://data.alltheplaces.xyz/runs/latest/info_embed.html', headers=UA), timeout=60).read().decode()
              m = re.search(r'https?://[^"\'\s>]+output\.zip', html)
              if not m: raise SystemExit('no output.zip link found')
              return m.group(0)

          def compact(s):
              return re.sub(r'[^a-z0-9]', '', fold(s).replace('&', 'and'))

          # spider files are named after the brand (tesco_gb, marks_and_spencer_gb, zabka_pl ...)
          TOKENS = {compact(a) for a in ALIASES} | {'seveneleven', 'mcdonald', 'chickfila', 'dunkin', 'sainsbury'}
          TOKENS = {t for t in TOKENS if t}

          def wanted(filename):
              n = compact(filename.rsplit('/', 1)[-1].split('.')[0])
              return any(t in n for t in TOKENS)

          def main(zip_path):
              db = {a: set() for a in ALIASES}
              files = 0
              with zipfile.ZipFile(zip_path) as z:
                  for info in z.infolist():
                      if info.is_dir() or not wanted(info.filename): continue
                      files += 1
                      with z.open(info) as fh:                       # stream line by line: some files are huge
                          for line in io.TextIOWrapper(fh, encoding='utf-8', errors='replace'):
                              line = line.strip().rstrip(',')
                              if not line.startswith('{') or '"Feature"' not in line: continue
                              try: f = json.loads(line)
                              except ValueError: continue
                              if f.get('type') != 'Feature': continue
                              g, p = f.get('geometry') or {}, f.get('properties') or {}
                              if g.get('type') != 'Point': continue
                              try: lng, lat = float(g['coordinates'][0]), float(g['coordinates'][1])
                              except (KeyError, IndexError, TypeError, ValueError): continue
                              if not inside(lat, lng): continue
                              for a in (match(p.get('brand')) or match(p.get('name'))):
                                  db[a].add((round(lat * 1e4), round(lng * 1e4)))   # ~11 m grid removes duplicates
              print('spider files read:', files)
              out = {}
              for a, pts in sorted(db.items()):
                  if not pts: continue
                  flat = []
                  for la, lo in sorted(pts): flat += [la * 10, lo * 10]
                  out[a] = flat
                  print(f'{a}: {len(pts)}')
              json.dump(out, open(OUT, 'w', encoding='utf-8'), separators=(',', ':'), ensure_ascii=False)
              print('total', sum(len(v) // 2 for v in out.values()), 'stores in', len(out), 'brands')

          if __name__ == '__main__':
              if len(sys.argv) > 3: main(sys.argv[3])
              else: print(latest_zip())
