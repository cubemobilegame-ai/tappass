# TapPass: jeden plik, który sam tworzy cały projekt i buduje APK.
# Wklej go w: repo -> Actions -> "set up a workflow yourself" -> Commit.
name: Build TapPass APK

on:
  workflow_dispatch:          # przycisk "Run workflow"
  push:                       # zapis tego pliku (commit) od razu buduje nowy APK
    branches: [main]
    paths: ['.github/workflows/**']

permissions:
  contents: write             # żeby wrzucić APK do zakładki Releases

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}   # sekrety są opcjonalne
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bootstrap Expo base
        run: |
          if [ ! -f package.json ]; then
            npx --yes create-expo-app@latest _base --template blank --no-install
            cp _base/package.json .
            if [ -f _base/index.js ]; then cp _base/index.js .; fi
            rm -rf _base
          fi

      - name: Write TapPass source files
        run: |
          mkdir -p assets
          cat > App.js <<'TAPPASS_EOF'
          import React, { useEffect, useState } from 'react';
          import { View, Text as RNText, Pressable, Modal, TextInput as RNTextInput, FlatList, ScrollView, Alert, StyleSheet, Linking, Platform, useColorScheme } from 'react-native';
          import { StatusBar } from 'expo-status-bar';
          import { useFonts, Inter_400Regular, Inter_500Medium, Inter_600SemiBold, Inter_700Bold, Inter_800ExtraBold } from '@expo-google-fonts/inter';
          import { SafeAreaView, SafeAreaProvider, useSafeAreaInsets } from 'react-native-safe-area-context';
          import AsyncStorage from '@react-native-async-storage/async-storage';
          import * as Notifications from 'expo-notifications';
          import * as Brightness from 'expo-brightness';
          import * as ImagePicker from 'expo-image-picker';
          import { CameraView, useCameraPermissions } from 'expo-camera';
          import { LinearGradient } from 'expo-linear-gradient';
          import Svg, { Rect, Path, Circle, Defs, LinearGradient as SvgGradient, Stop, G } from 'react-native-svg';
          import QRCode from 'react-native-qrcode-svg';
          import JsBarcode from 'jsbarcode';
          import { STORES } from './stores';
          import { askPermissions, refreshGeofences, stopGeo, notifyNear, getStatus, ensureChannel, getLog } from './geo';

          // dev tools (Pro switch + geofence simulator) show in dev builds, or in any build with EXPO_PUBLIC_DEV_TOOLS=1
          const DEV_TOOLS = __DEV__ || process.env.EXPO_PUBLIC_DEV_TOOLS === '1';
          const FREE_LIMIT = 3;
          const FMT = { ean13: 'EAN13', ean8: 'EAN8', upc_a: 'UPC', upc_e: 'UPCE', code39: 'CODE39', code128: 'CODE128', itf14: 'ITF', codabar: 'codabar' };
          const SCAN_TYPES = ['qr', ...Object.keys(FMT)];

          const darken = (c, f = 0.4) => {
            if (c.startsWith('#')) { const n = parseInt(c.slice(1), 16), m = v => Math.round(v * (1 - f)); return `rgb(${m(n >> 16)},${m((n >> 8) & 255)},${m(n & 255)})`; }
            return c.replace(/\d+%\)$/, '26%)');
          };
          const palette = dark => dark
            ? { bg: '#000', card: '#1c1c1e', text: '#f5f5f7', sub: '#98989f', line: '#2c2c2e', accent: '#0a84ff', green: '#34c759' }
            : { bg: '#f2f2f7', card: '#fff', text: '#111', sub: '#6b6b73', line: '#e1e1e8', accent: '#007aff', green: '#34c759' };
          const SIM = ['CVS', 'Target', 'Walgreens', 'Walmart', 'Starbucks', 'Żabka', 'Biedronka'];

          const brand = name => {
            const s = STORES.find(x => x.n.toLowerCase() === name.trim().toLowerCase());
            if (s) return { ...s, d: darken(s.c) };
            let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
            return { n: name, c: `hsl(${h},55%,42%)`, l: (name.trim()[0] || '?').toUpperCase(), t: '#fff', d: darken(`hsl(${h},55%,42%)`) };
          };
          const cleanCode = v => { v = v.replace(/[^\x20-\x7E]/g, '').trim(); return (/^[\d\s-]+$/.test(v) ? v.replace(/[\s-]/g, '') : v).slice(0, 120); };

          // ---- Inter font for every Text / TextInput (same look on all phones) ----
          const FONT = { 400: 'Inter_400Regular', 500: 'Inter_500Medium', 600: 'Inter_600SemiBold', 700: 'Inter_700Bold', 800: 'Inter_800ExtraBold', 900: 'Inter_800ExtraBold', normal: 'Inter_400Regular', bold: 'Inter_700Bold' };
          function Text({ style, ...p }) {
            const { fontWeight, ...rest } = StyleSheet.flatten(style) || {};
            return <RNText {...p} style={[rest, { fontFamily: FONT[fontWeight || 400] || FONT[400] }]} />;
          }
          function TextInput({ style, ...p }) {
            return <RNTextInput {...p} style={[style, { fontFamily: FONT[400] }]} />;
          }

          // ---- App logo (same artwork as the icon and the HTML prototype) ----
          const LOGO_ARCS = [['M640.1 386.6A45 45 0 0 1 640.1 453.4', 1], ['M673.6 349.4A95 95 0 0 1 673.6 490.6', 0.7], ['M707.0 312.2A145 145 0 0 1 707.0 527.8', 0.45]];
          const LOGO_BARS = [[212,14], [236,8], [254,22], [286,10], [306,16], [332,8], [350,24], [384,12], [406,8], [424,20], [454,10], [474,16], [500,8], [518,22], [550,12], [572,10]];
          function Logo({ size = 34 }) {
            return (
              <Svg width={size} height={size} viewBox="0 0 1024 1024">
                <Defs><SvgGradient id="lg" x1="0" y1="0" x2="1" y2="1"><Stop offset="0" stopColor="#2f95ff" /><Stop offset="1" stopColor="#5a3df0" /></SvgGradient></Defs>
                <Rect width={1024} height={1024} rx={230} fill="url(#lg)" />
                <Rect x={162} y={292} width={700} height={440} rx={64} fill="#fff" />
                <Rect x={212} y={342} width={150} height={28} rx={14} fill="#2f7bff" />
                <G fill="none" stroke="#2f7bff" strokeLinecap="round" strokeWidth={30}>
                  {LOGO_ARCS.map(([d, o]) => <Path key={d} d={d} opacity={o} />)}
                </G>
                {LOGO_BARS.map(([x, w]) => <Rect key={x} x={x} y={566} width={w} height={92} rx={2} fill="#22307a" />)}
              </Svg>
            );
          }

          // ---- iOS-style switch (identical on Android) ----
          function IosSwitch({ value, onValueChange }) {
            return (
              <Pressable onPress={() => onValueChange(!value)} hitSlop={8} style={{ width: 51, height: 31, borderRadius: 16, backgroundColor: value ? '#34c759' : 'rgba(120,120,128,0.32)', justifyContent: 'center' }}>
                <View style={{ position: 'absolute', top: 2, left: value ? 22 : 2, width: 27, height: 27, borderRadius: 14, backgroundColor: '#fff', elevation: 3, shadowColor: '#000', shadowOpacity: 0.25, shadowRadius: 3, shadowOffset: { width: 0, height: 2 } }} />
              </Pressable>
            );
          }
          const CloseBtn = ({ t, onPress }) => (
            <Pressable onPress={onPress} style={{ alignSelf: 'flex-end', width: 30, height: 30, borderRadius: 15, backgroundColor: t.line, alignItems: 'center', justifyContent: 'center', marginBottom: 6 }}>
              <Text style={{ color: t.sub, fontSize: 15 }}>✕</Text>
            </Pressable>
          );

          function Tile({ name, size = 46, translucent }) {
            const b = brand(name);
            return <View style={{ width: size, height: size, borderRadius: size / 4, backgroundColor: translucent ? 'rgba(255,255,255,.22)' : b.c, alignItems: 'center', justifyContent: 'center' }}>
              <Text style={{ color: b.t, fontWeight: '800', fontSize: size * 0.5 }}>{b.l}</Text></View>;
          }

          function Barcode({ value, fmt, width }) {
            let bars = null;
            for (const f of [fmt || 'CODE128', 'CODE128']) {
              try { const o = {}; JsBarcode(o, value, { format: f }); bars = o.encodings[0].data; break; } catch (e) {}
            }
            if (!bars) return <Text>Invalid code</Text>;
            return <Svg width={width} height={170} viewBox={`0 0 ${bars.length} 1`} preserveAspectRatio="none">
              {[...bars].map((b, i) => b === '1' ? <Rect key={i} x={i} y={0} width={1} height={1} fill="#000" /> : null)}</Svg>;
          }
          const Code = ({ card, width }) => <View style={{ backgroundColor: '#fff', padding: 16, borderRadius: 12, alignItems: 'center' }}>
            {card.type === 'qr' ? <QRCode value={card.num} size={Math.min(width, 300)} /> : <Barcode value={card.num} fmt={card.fmt} width={width} />}
            <Text style={{ color: '#000', marginTop: 8, fontSize: 16 }}>{card.type === 'qr' ? '' : card.num}</Text></View>;


          function Row({ t, ico, bg, title, sub, onPress, right }) {
            return (
              <Pressable onPress={onPress} style={{ flexDirection: 'row', alignItems: 'center', gap: 14, paddingVertical: 12, paddingHorizontal: 14, borderBottomWidth: 0.5, borderColor: t.line }}>
                {ico ? <View style={{ width: 30, height: 30, borderRadius: 8, backgroundColor: bg, alignItems: 'center', justifyContent: 'center' }}><Text style={{ color: '#fff', fontSize: 16 }}>{ico}</Text></View> : null}
                <View style={{ flex: 1 }}>
                  <Text style={{ color: t.text, fontSize: 17, fontWeight: '600' }}>{title}</Text>
                  {sub ? <Text style={{ color: t.sub, fontSize: 13 }}>{sub}</Text> : null}
                </View>
                {right === undefined ? <Text style={{ color: t.sub, fontSize: 20 }}>›</Text> : right}
              </Pressable>
            );
          }
          const Group = ({ t, children }) => <View style={{ backgroundColor: t.card, borderRadius: 14, marginVertical: 8, overflow: 'hidden' }}>{children}</View>;
          const Sec = ({ t, children }) => <Text style={{ color: t.sub, fontSize: 13, letterSpacing: 0.4, textTransform: 'uppercase', marginTop: 20, marginHorizontal: 14, marginBottom: -2 }}>{children}</Text>;
          const Seg = ({ t, value, options, onChange }) => (
            <View style={{ flexDirection: 'row', backgroundColor: t.line, borderRadius: 10, padding: 2 }}>
              {options.map(([k, l]) => (
                <Pressable key={k} onPress={() => onChange(k)} style={{ flex: 1, padding: 8, borderRadius: 8, backgroundColor: value === k ? t.card : 'transparent' }}>
                  <Text style={{ textAlign: 'center', color: t.text, fontWeight: value === k ? '700' : '400' }}>{l}</Text>
                </Pressable>))}
            </View>
          );
          const TabIcon = ({ kind, color }) => (
            <Svg width={25} height={25} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round">
              {kind === 'w'
                ? <><Rect x={3} y={6} width={18} height={13} rx={3} /><Path d="M3 10h18M16 14.5h2" /></>
                : <><Path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><Circle cx={16} cy={7} r={2} /><Circle cx={8} cy={17} r={2} /></>}
            </Svg>
          );

          function Main() {
            const sys = useColorScheme();
            const insets = useSafeAreaInsets();
            const [fontsLoaded] = useFonts({ Inter_400Regular, Inter_500Medium, Inter_600SemiBold, Inter_700Bold, Inter_800ExtraBold });
            const [ready, setReady] = useState(false);
            const [cards, setCards] = useState([]);
            const [pro, setPro] = useState(false);
            const [geo, setGeo] = useState(false);
            const [theme, setTheme] = useState('system');
            const [dev, setDev] = useState(true);
            const [reliable, setReliable] = useState(true);
            const [tab, setTab] = useState('w');
            const [adding, setAdding] = useState(false);
            const [paywall, setPaywall] = useState(false);
            const [full, setFull] = useState(null);
            const [pending, setPending] = useState(null);
            const [choose, setChoose] = useState(null);
            const [plan, setPlan] = useState('yearly');
            const [toast, setToast] = useState('');
            const [gstat, setGstat] = useState(null);
            const t = palette(theme === 'system' ? sys === 'dark' : theme === 'dark');
            const say = m => { setToast(m); setTimeout(() => setToast(''), 2600); };

            useEffect(() => { (async () => {
              const v = await Promise.all(['cards', 'pro', 'geo', 'theme', 'dev', 'reliable'].map(k => AsyncStorage.getItem(k)));
              setCards(v[0] ? JSON.parse(v[0]) : []); setPro(v[1] === '1'); setGeo(v[2] === '1');
              setTheme(v[3] || 'system'); setDev(v[4] === null ? true : v[4] === '1'); setReliable(v[5] !== '0'); setReady(true);
            })(); }, []);
            useEffect(() => { if (!ready) return;
              AsyncStorage.multiSet([['cards', JSON.stringify(cards)], ['pro', pro ? '1' : '0'], ['geo', geo ? '1' : '0'], ['theme', theme], ['dev', dev ? '1' : '0'], ['reliable', reliable ? '1' : '0']]);
            }, [cards, pro, geo, theme, dev, reliable, ready]);
            useEffect(() => { ensureChannel().catch(() => {}); }, []);
            // keep geofences in sync (needs Pro + toggle + at least one card)
            useEffect(() => { if (!ready) return; (async () => {
              try { if (geo && pro && cards.length) await refreshGeofences(cards, reliable); else await stopGeo(); }
              catch (e) { console.warn('geofence', e.message); }
              setGstat(await getStatus());
            })(); }, [geo, pro, cards, reliable, ready]);
            // notification tap -> open card (also on cold start)
            useEffect(() => {
              const open = r => { const ids = r?.notification.request.content.data?.cardIds; if (ids?.length) setPending(ids); };
              Notifications.getLastNotificationResponseAsync().then(open);
              const sub = Notifications.addNotificationResponseReceivedListener(open);
              return () => sub.remove();
            }, []);
            useEffect(() => { if (!pending || !ready) return;
              const m = cards.filter(x => pending.includes(x.id));
              if (m.length === 1) setFull(m[0]); else if (m.length) setChoose(m);
              setPending(null);
            }, [pending, ready, cards]);
            // max brightness for scanners
            useEffect(() => { if (!full) return; let prev;
              (async () => { try { prev = await Brightness.getBrightnessAsync(); await Brightness.setBrightnessAsync(1); } catch (e) {} })();
              return () => { if (prev !== undefined) Brightness.setBrightnessAsync(prev).catch(() => {}); };
            }, [full]);

            const tryAdd = () => (!pro && cards.length >= FREE_LIMIT) ? setPaywall(true) : setAdding(true);
            const toggleGeo = async () => {
              if (!pro) return setPaywall(true);
              if (!geo && !(await askPermissions())) return Alert.alert('Permission needed', 'Allow location "Always" and notifications in system settings.');
              setGeo(!geo);
            };
            const toggleDevPro = v => { setPro(v); if (!v) setGeo(false); };
            const restore = () => say(pro ? 'Purchases restored. TapPass Pro is active.' : 'No active subscription found.');
            const sw = (v, f) => <IosSwitch value={v} onValueChange={f} />;
            const geoRow = (
              <Group t={t}><Row t={t} ico="📍" bg="#007aff" title={'GPS Geo-alerts' + (pro ? '' : ' 🔒')} sub="Show your card automatically near a store" onPress={toggleGeo} right={sw(geo && pro, toggleGeo)} /></Group>
            );
            const refreshNow = async () => {
              say('Refreshing nearby stores…');
              try { const n = await refreshGeofences(cards, reliable); say(`Watching ${n} nearby stores`); } catch (e) { say('Error: ' + e.message); }
              setGstat(await getStatus());
            };
            const showLog = async () => Alert.alert('Geo log', ((await getLog()) || ['(empty)']).slice(0, 14).join('\n'));
            const gtext = !(geo && pro) ? 'Off' : !cards.length ? 'Add a card first' : !gstat ? 'Checking…'
              : gstat.err ? 'Error: ' + gstat.err
              : gstat.nearest ? `Watching ${gstat.count} stores · nearest: ${gstat.nearest.name}, ${gstat.nearest.d} m` : 'No stores of your cards found nearby';
            const title = txt => <Text style={{ color: t.text, fontSize: 32, fontWeight: '800', letterSpacing: -0.5 }}>{txt}</Text>;

            if (!fontsLoaded) return null;
            return (
              <SafeAreaView edges={['top', 'left', 'right']} style={{ flex: 1, backgroundColor: t.bg }}>
                <StatusBar style={t.bg === '#000' ? 'light' : 'dark'} />
                <ScrollView contentContainerStyle={{ padding: 16, paddingBottom: 30 }}>
                  {tab === 'w' ? <>
                    <View style={{ flexDirection: 'row', justifyContent: 'space-between', alignItems: 'flex-end' }}>
                      <View style={{ gap: 6 }}>
                        <View style={{ flexDirection: 'row', alignItems: 'center', gap: 10 }}>
                          <Logo size={34} />
                          {title('TapPass')}
                        </View>
                        {pro
                          ? <LinearGradient colors={['#ff9f0a', '#ff375f']} start={{ x: 0, y: 0 }} end={{ x: 1, y: 0 }} style={{ alignSelf: 'flex-start', borderRadius: 99, paddingHorizontal: 8, paddingVertical: 3 }}><Text style={{ color: '#fff', fontSize: 12, fontWeight: '700' }}>PRO</Text></LinearGradient>
                          : <Pressable onPress={() => setPaywall(true)} style={{ alignSelf: 'flex-start', backgroundColor: t.line, borderRadius: 99, paddingHorizontal: 8, paddingVertical: 3 }}><Text style={{ color: t.sub, fontSize: 12, fontWeight: '700' }}>FREE · {cards.length}/{FREE_LIMIT} cards</Text></Pressable>}
                      </View>
                      <Pressable onPress={tryAdd} style={{ backgroundColor: t.accent, borderRadius: 99, paddingHorizontal: 16, paddingVertical: 8 }}><Text style={{ color: '#fff', fontWeight: '700', fontSize: 15 }}>+ Add Card</Text></Pressable>
                    </View>
                    <View style={{ marginTop: 18 }}>
                      {cards.length ? cards.map(c => { const b = brand(c.name); return (
                        <Pressable key={c.id} onPress={() => setFull(c)} style={{ marginBottom: 14, borderRadius: 20, overflow: 'hidden', elevation: 4, shadowColor: '#000', shadowOpacity: 0.2, shadowRadius: 10, shadowOffset: { width: 0, height: 6 } }}>
                          <LinearGradient colors={[b.c, b.d]} start={{ x: 0, y: 0 }} end={{ x: 1, y: 1 }} style={{ height: 122, padding: 16 }}>
                            <Text style={{ position: 'absolute', right: -4, bottom: -40, fontSize: 160, fontWeight: '900', color: b.t, opacity: 0.14 }}>{b.l}</Text>
                            <View style={{ flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center' }}>
                              <Tile name={c.name} size={38} translucent /><Text style={{ color: b.t, opacity: 0.9, fontSize: 13 }}>{c.type === 'qr' ? 'QR code' : 'Barcode'} ›</Text>
                            </View>
                            <Text style={{ color: b.t, fontSize: 21, fontWeight: '700', marginTop: 12 }}>{c.name}</Text>
                            <Text style={{ color: b.t, opacity: 0.85, fontSize: 13 }}>•••• {c.num.slice(-4)}</Text>
                          </LinearGradient>
                        </Pressable>); })
                        : <View style={{ alignItems: 'center', padding: 40 }}><Text style={{ fontSize: 48 }}>💳</Text><Text style={{ color: t.text, fontWeight: '700', marginTop: 6 }}>No cards yet</Text><Text style={{ color: t.sub, marginTop: 4 }}>Add your first loyalty card to get started.</Text></View>}
                    </View>
                    {!pro && (
                      <Pressable onPress={() => setPaywall(true)} style={{ marginBottom: 12 }}>
                        <LinearGradient colors={['#ff9f0a', '#ff375f']} start={{ x: 0, y: 0 }} end={{ x: 1, y: 0 }} style={{ borderRadius: 16, padding: 14 }}>
                          <Text style={{ color: '#fff', fontSize: 17, fontWeight: '700' }}>✨ Go Pro</Text>
                          <Text style={{ color: '#fff', fontSize: 13 }}>Unlimited cards and GPS Geo-alerts. 14 days free.</Text>
                        </LinearGradient>
                      </Pressable>)}
                    {geoRow}
                  </> : <>
                    {title('Settings')}
                    <Sec t={t}>Subscription</Sec>
                    <Group t={t}>
                      <Row t={t} ico="⭐" bg="#ff9f0a" title={pro ? 'TapPass Pro' : 'Upgrade to Pro'} sub={pro ? 'Active · unlimited cards' : '14 days free, then from $2.99/month'} onPress={() => setPaywall(true)} />
                      <Row t={t} ico="↻" bg="#007aff" title="Restore Purchases" onPress={restore} />
                      {pro && <Row t={t} ico="⚙" bg="#8e8e93" title="Manage Subscription" sub="App Store / Google Play" onPress={() => say('Opens your store subscription settings')} />}
                    </Group>
                    <Sec t={t}>Preferences</Sec>
                    {geoRow}
                    {geo && pro && <Group t={t}><Row t={t} ico="🛰" bg="#34c759" title="Geo-alerts status" sub={gtext} onPress={refreshNow} right={<Text style={{ color: t.accent, fontSize: 13 }}>Refresh</Text>} /></Group>}
                    {Platform.OS === 'android' && geo && pro && <Group t={t}>
                      <Row t={t} ico="🔋" bg="#ff9500" title="Reliable mode" sub="Keeps a small notification so Android doesn’t stop alerts" onPress={() => setReliable(!reliable)} right={sw(reliable, setReliable)} />
                      <Row t={t} ico="⚙️" bg="#8e8e93" title="Battery & background help" sub="Set TapPass battery usage to Unrestricted" onPress={() => Linking.openSettings()} />
                    </Group>}
                    <Group t={t}>
                      <View style={{ padding: 14, gap: 8 }}>
                        <View style={{ flexDirection: 'row', alignItems: 'center', gap: 14 }}>
                          <View style={{ width: 30, height: 30, borderRadius: 8, backgroundColor: '#5856d6', alignItems: 'center', justifyContent: 'center' }}><Text style={{ color: '#fff', fontSize: 16 }}>🌓</Text></View>
                          <Text style={{ color: t.text, fontSize: 17, fontWeight: '600' }}>Appearance</Text>
                        </View>
                        <Seg t={t} value={theme} onChange={setTheme} options={[['system', 'System'], ['light', 'Light'], ['dark', 'Dark']]} />
                      </View>
                    </Group>
                    <Sec t={t}>Support</Sec>
                    <Group t={t}>
                      <Row t={t} ico="✉️" bg="#34c759" title="Contact Support" sub="support@tappass.app" onPress={() => say('Opens your mail app')} />
                      <Row t={t} ico="★" bg="#ff9f0a" title="Rate TapPass" onPress={() => say('Opens the store review page')} />
                      <Row t={t} ico="🔒" bg="#8e8e93" title="Privacy Policy" onPress={() => say('Opens privacy policy')} />
                      <Row t={t} ico="📄" bg="#8e8e93" title="Terms of Use" onPress={() => say('Opens terms of use')} />
                    </Group>
                    <Sec t={t}>Data</Sec>
                    <Group t={t}>
                      <Row t={t} ico="🗑" bg="#ff3b30" title="Delete All Cards" sub={cards.length + ' saved on this device'} onPress={() => cards.length && Alert.alert('Delete all cards?', '', [{ text: 'Cancel' }, { text: 'Delete', style: 'destructive', onPress: () => setCards([]) }])} />
                    </Group>
                    {DEV_TOOLS && <>
                      <Sec t={t}>Developer</Sec>
                      <Group t={t}><Row t={t} ico="🛠" bg="#636366" title="Developer mode" sub="Test tools. Remove in the production build." onPress={() => setDev(!dev)} right={sw(dev, setDev)} /></Group>
                      {dev && (
                        <Group t={t}>
                          <Row t={t} title="Dev Mode: Toggle Pro Status" sub={pro ? 'Pro is ON' : 'Pro is OFF'} onPress={() => toggleDevPro(!pro)} right={sw(pro, toggleDevPro)} />
                          <Text style={{ color: t.sub, fontSize: 13, padding: 12, paddingBottom: 4 }}>Geofencing simulator (needs Pro and Geo-alerts ON)</Text>
                          <Row t={t} title="🔔 Send test notification" sub="Uses your first card" onPress={() => cards.length ? notifyNear([cards[0].name]) : say('Add a card first')} right={<View />} />
                          <Row t={t} title="📜 Show geo log" sub="Last geofence and location events" onPress={showLog} right={<View />} />
                          {SIM.map(n => <Row key={n} t={t} title={`📍 Simulate: Walking into ${n}`} onPress={() => notifyNear([n])} right={<View />} />)}
                          <Row t={t} title="📍 Simulate: Mall with 3 stores" sub="CVS + Target + Starbucks" onPress={() => notifyNear(['CVS', 'Target', 'Starbucks'])} right={<View />} />
                        </Group>)}
                    </>}
                    <Text style={{ color: t.sub, fontSize: 12, textAlign: 'center', marginTop: 12 }}>Store locations © OpenStreetMap contributors</Text>
