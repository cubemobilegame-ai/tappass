              await glog('refresh error ' + String(e.message || e).slice(0, 100));
              await setStatus({ err: String(e.message || e).slice(0, 120) });
              throw e;
            } finally { refreshing = false; }
          }

          export async function stopGeo() {
            if (await Location.hasStartedGeofencingAsync(TASK)) await Location.stopGeofencingAsync(TASK);
            await stopLoc();
            await AsyncStorage.multiRemove(['geoRetry', 'geo:near']);
          }
