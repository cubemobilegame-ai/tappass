# TapPass: jeden plik, który sam tworzy cały projekt i buduje APK.
# Wklej go w: repo -> Actions -> "set up a workflow yourself" -> Commit.
name: Build TapPass APK

on:
  workflow_dispatch:          # przycisk "Run workflow"
  push:                       # zapis tego pliku (commit) od razu buduje nowy APK
    branches: [main]
    paths: ['.github/workflows/**', 'brand/**']

permissions:
  contents: write             # żeby wrzucić APK do zakładki Releases

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}   # sekrety są opcjonalne
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bootstrap Expo base
        run: |
          if [ ! -f package.json ]; then
            npx --yes create-expo-app@latest _base --template blank --no-install
            cp _base/package.json .
            if [ -f _base/index.js ]; then cp _base/index.js .; fi
            rm -rf _base
          fi

      - name: Write TapPass source files
        run: |
          mkdir -p assets
          cat > App.js <<'TAPPASS_EOF'
          import React, { useEffect, useRef, useState } from 'react';
          import { ActivityIndicator, View, Text as RNText, Pressable, Modal, TextInput as RNTextInput, ScrollView, StyleSheet, Linking, Platform, useColorScheme, AppState, KeyboardAvoidingView, Alert, BackHandler } from 'react-native';
          import { StatusBar } from 'expo-status-bar';
          import { useFonts, PlusJakartaSans_400Regular, PlusJakartaSans_500Medium, PlusJakartaSans_600SemiBold, PlusJakartaSans_700Bold, PlusJakartaSans_800ExtraBold } from '@expo-google-fonts/plus-jakarta-sans';
          import { SafeAreaProvider, useSafeAreaInsets } from 'react-native-safe-area-context';
          import AsyncStorage from '@react-native-async-storage/async-storage';
          import * as Notifications from 'expo-notifications';
          import * as Brightness from 'expo-brightness';
          import * as Battery from 'expo-battery';
          import * as Location from 'expo-location';
          import * as ImagePicker from 'expo-image-picker';
          import * as ImageManipulator from 'expo-image-manipulator';
          import { decodeJpegBase64 } from './imgscan';
          import { CameraView, useCameraPermissions } from 'expo-camera';
          import { LinearGradient } from 'expo-linear-gradient';
          import Svg, { Rect, Path, Circle, Defs, LinearGradient as SvgGradient, RadialGradient, Stop, G, SvgXml } from 'react-native-svg';
          import { Animated, Easing, useWindowDimensions } from 'react-native';
          import { ART, IC, LOGO } from './art';
          import QRCode from 'react-native-qrcode-svg';
          import JsBarcode from 'jsbarcode';
          import { STORES, catOf, fold, cardsForLabel } from './stores';
          import * as Billing from './billing';
          import { askPermissions, refreshGeofences, stopGeo, notifyNear, getStatus, ensureChannel, getLog } from './geo';

          // dev tools (Pro switch + geofence simulator) show in dev builds, or in any build with EXPO_PUBLIC_DEV_TOOLS=1
          const DEV_TOOLS = __DEV__ || process.env.EXPO_PUBLIC_DEV_TOOLS === '1';
          const FREE_LIMIT = 3;
          const FMT = { ean13: 'EAN13', ean8: 'EAN8', upc_a: 'UPC', upc_e: 'UPCE', code39: 'CODE39', code128: 'CODE128', itf14: 'ITF', codabar: 'codabar' };
          const SCAN_TYPES = ['qr', ...Object.keys(FMT)];
          // camera: leave out ITF and Codabar - they have no check digit and produce random "codes" from blurry frames
          const CAM_TYPES = ['qr', 'ean13', 'ean8', 'upc_a', 'upc_e', 'code128', 'code39', 'pdf417'];
          const CHECKED = ['qr', 'ean13', 'ean8', 'upc_a', 'upc_e', 'code128', 'pdf417', 'aztec', 'datamatrix'];   // formats with a check digit
          const MLKIT = { 1: 'code128', 2: 'code39', 4: 'code93', 8: 'codabar', 16: 'datamatrix', 32: 'ean13', 64: 'ean8', 128: 'itf14', 256: 'qr', 512: 'upc_a', 1024: 'upc_e', 2048: 'pdf417', 4096: 'aztec' };
          const normScan = r => r && r.data ? { data: String(r.data), type: typeof r.type === 'number' ? (MLKIT[r.type] || 'code128') : String(r.type || '').toLowerCase().replace('-', '_') } : null;
          const plausible = r => {
            if (!r || !r.data) return false;
            if (['qr', 'pdf417', 'aztec', 'datamatrix'].includes(r.type)) return r.data.length >= 1;
            return r.data.length >= 4 && /^[\x20-\x7E]+$/.test(r.data);    // 1D loyalty codes are plain ASCII
          };
          async function scanLog(m) {
            try { const l = JSON.parse((await AsyncStorage.getItem('scanLog')) || '[]'); l.unshift(`${new Date().toLocaleTimeString()} ${m}`); await AsyncStorage.setItem('scanLog', JSON.stringify(l.slice(0, 30))); } catch (e) {}
          }
          // resized copy of a photo (native, fast). Returns { uri, base64? }
          async function resized(uri, w, base64 = false) {
            const IM = ImageManipulator.ImageManipulator;
            if (IM && IM.manipulate) {                       // new API (SDK 52+)
              const ctx = IM.manipulate(uri); ctx.resize({ width: w });
              const img = await ctx.renderAsync();
              return await img.saveAsync({ base64, compress: 0.9, format: ImageManipulator.SaveFormat.JPEG });
            }
            return await ImageManipulator.manipulateAsync(uri, [{ resize: { width: w } }], { base64, compress: 0.9, format: ImageManipulator.SaveFormat.JPEG });
          }
          // Reads a code from a gallery photo: phone's own reader on a resized copy (fast), then on the
          // original, and only then our slower JavaScript reader on a small copy.
          async function readPhoto(uri, width) {
            const t0 = Date.now(), steps = [];
            const sys = async (u, tag) => {
              try { const r = (await CameraView.scanFromURLAsync(u, SCAN_TYPES)).map(normScan).filter(plausible)[0] || null; steps.push(`${tag}:${r ? 'ok' : '-'}`); return r; }
              catch (e) { steps.push(`${tag} err ${String(e.message || e).slice(0, 40)}`); return null; }
            };
            let r = null;
            try { const small = await resized(uri, Math.min(1600, width || 1600)); r = await sys(small.uri, 'sys1600'); } catch (e) { steps.push('resize err ' + String(e.message || e).slice(0, 40)); }
            if (!r) r = await sys(uri, 'sysFull');
            if (!r) {
              try {
                const s2 = await resized(uri, Math.min(1000, width || 1000), true);
                await new Promise(ok => setTimeout(ok, 30));
                const d = normScan(decodeJpegBase64(s2.base64)); r = plausible(d) ? d : null; steps.push(`js1000:${r ? 'ok' : '-'}`);
              } catch (e) { steps.push('js err ' + String(e.message || e).slice(0, 40)); }
            }
            await scanLog(`photo ${width || '?'}px ${Date.now() - t0} ms ${steps.join(' ')}${r ? ' -> ' + r.type + ' ' + r.data.slice(0, 24) : ''}`);
            return r;
          }
          const SIM = ['Tesco', "Sainsbury's", 'Argos', 'Boots', 'CVS', 'Target', 'Walgreens', 'Walmart', 'Starbucks', 'Żabka', 'Biedronka'];

          // ---------- colours (same tokens as the HTML prototype) ----------
          const palette = dark => dark
            ? { dark: true, bg: '#121214', card: '#1c1c20', panel: '#222238', text: '#f4f4f7', sub: '#9b9cad', line: '#2b2b33', accent: '#a99bff', on: '#14141a', green: '#34c759', shadow: '0px 10px 30px rgba(0,0,0,0.45)' }
            : { dark: false, bg: '#f4f5fb', card: '#ffffff', panel: '#e7eafb', text: '#14141a', sub: '#6f7285', line: '#e8e9f1', accent: '#5a3df0', on: '#ffffff', green: '#34c759', shadow: '0px 10px 30px rgba(40,40,90,0.12)' };
          const hex = c => { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
          const rgba = (c, a) => { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${a})`; };
          const mix = (a, b, p) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(v * p + y[i] * (1 - p))).join(',')})`; };
          const toHex = c => {
            if (c.startsWith('#')) return c;
            const m = c.match(/hsl\((\d+)\D+(\d+)%\D+(\d+)%/); if (!m) return '#777777';
            const h = +m[1], s = m[2] / 100, l = m[3] / 100, k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
            const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
            return '#' + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, '0')).join('');
          };

          const brand = name => {
            const s = STORES.find(x => x.n.toLowerCase() === name.trim().toLowerCase());
            if (s) return s;
            let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
            return { n: name, c: toHex(`hsl(${h},55%,42%)`), l: (name.trim()[0] || '?').toUpperCase(), t: '#fff' };
          };
          // scanned codes keep their full content (QR codes can hold long links); typed numbers are tidied up
          const cleanScan = v => { v = String(v || '').trim(); return (/^[\d\s-]+$/.test(v) ? v.replace(/[\s-]/g, '') : v).slice(0, 2000); };
          const cleanCode = v => { v = v.replace(/[^\x20-\x7E]/g, '').trim(); return (/^[\d\s-]+$/.test(v) ? v.replace(/[\s-]/g, '') : v).slice(0, 120); };
          const fmtNum = n => n.replace(/(.{4})/g, '$1 ').trim();

          // ---------- Plus Jakarta Sans for every Text / TextInput (same look as the prototype) ----------
          const FONT = { 400: 'PlusJakartaSans_400Regular', 500: 'PlusJakartaSans_500Medium', 600: 'PlusJakartaSans_600SemiBold', 700: 'PlusJakartaSans_700Bold', 800: 'PlusJakartaSans_800ExtraBold', 900: 'PlusJakartaSans_800ExtraBold', normal: 'PlusJakartaSans_400Regular', bold: 'PlusJakartaSans_700Bold' };
          function Text({ style, ...p }) {
            const { fontWeight, ...rest } = StyleSheet.flatten(style) || {};
            return <RNText {...p} style={[rest, fontWeight || !rest.fontFamily ? { fontFamily: FONT[fontWeight || 400] || FONT[400] } : null]} />;
          }
          function TextInput({ style, ...p }) { return <RNTextInput {...p} style={[style, { fontFamily: FONT[400] }]} />; }

          // ---------- artwork ----------
          function Logo({ size = 76 }) {
            return <SvgXml xml={LOGO} width={size} height={size} />;
          }
          // soft orange/lilac glow used in the stat tiles
          function Orb({ size, style }) {
            return (
              <View pointerEvents="none" style={[{ position: 'absolute', width: size, height: size, opacity: 0.9 }, style]}>
                <Svg width={size} height={size} viewBox="0 0 100 100">
                  <Defs><RadialGradient id="orb" cx="45" cy="45" r="55" gradientUnits="userSpaceOnUse">
                    <Stop offset="0" stopColor="#ff6a2b" stopOpacity="1" /><Stop offset="0.36" stopColor="#ff6a2b" stopOpacity="0.95" />
                    <Stop offset="0.64" stopColor="#c9a7ff" stopOpacity="0.7" /><Stop offset="0.9" stopColor="#c9a7ff" stopOpacity="0" /></RadialGradient></Defs>
                  <Circle cx={50} cy={50} r={50} fill="url(#orb)" />
                </Svg>
              </View>
            );
          }
          const Icon = ({ d, size = 22, color, width = 1.9, children }) => (
            <Svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={width} strokeLinecap="round" strokeLinejoin="round">{d ? <Path d={d} /> : children}</Svg>
          );
          const TAB_ICON = {
            w: c => <Icon color={c}><Rect x={3} y={6} width={18} height={13} rx={3} /><Path d="M3 10h18M16 14.5h2" /></Icon>,
            a: c => <Icon color={c} d="M3 12h4l3-8 4 16 3-8h4" />,
            l: c => <Icon color={c} d="M10 6h10M10 12h10M10 18h10M4 6l1.2 1.2L7.5 5M4 12l1.2 1.2L7.5 11M4 18l1.2 1.2L7.5 17" />,
            s: c => <Icon color={c}><Path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><Circle cx={16} cy={7} r={2} /><Circle cx={8} cy={17} r={2} /></Icon>,
          };

          // line icon from the shared set; colour applied to strokes (and the few filled details)
          function Ic({ name, size = 19, color = '#fff', width = 2 }) {
            const body = (IC[name] || '').replace(/#fff/g, color);
            return <SvgXml width={size} height={size} xml={`<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`} />;
          }

          // ---------- small building blocks ----------
          function Sw({ on, s = 1 }) {
            return (
              <View style={{ width: 51 * s, height: 31 * s, borderRadius: 99, backgroundColor: on ? '#34c759' : 'rgba(120,120,128,0.32)' }}>
                <View style={{ position: 'absolute', top: 2 * s, left: (on ? 22 : 2) * s, width: 27 * s, height: 27 * s, borderRadius: 99, backgroundColor: '#fff', boxShadow: '0px 2px 4px rgba(0,0,0,0.25)' }} />
              </View>
            );
          }
          function Tile({ name, size = 46, radius = 13, font = 24, translucent, color }) {
            const b = brand(name);
            return (
              <View style={{ width: size, height: size, borderRadius: radius, backgroundColor: translucent ? 'rgba(255,255,255,0.22)' : b.c, alignItems: 'center', justifyContent: 'center' }}>
                <Text style={{ color: color || b.t, fontWeight: '800', fontSize: font }}>{b.l}</Text>
              </View>
            );
          }
          function Barcode({ value, fmt, big }) {
            let enc = null;
            for (const f of [fmt || 'CODE128', 'CODE128']) {
              try { const o = {}; JsBarcode(o, value, { format: f }); enc = o.encodings; break; } catch (e) {}
            }
            if (!enc) return <Text style={{ color: '#888' }}>Invalid code</Text>;
            const bars = enc.map(e => e.data).join('');
            const w = big ? 3 : 2, h = big ? 170 : 70, m = 10, W = bars.length * w + m * 2;
            return (
              <View style={{ width: '100%', alignItems: 'center' }}>
                <View style={{ width: '100%', aspectRatio: W / (h + m * 2) }}>
                  <Svg width="100%" height="100%" viewBox={`0 0 ${W} ${h + m * 2}`}>
                    <Rect width={W} height={h + m * 2} fill="#fff" />
                    {[...bars].map((b, i) => b === '1' ? <Rect key={i} x={m + i * w} y={m} width={w} height={h} fill="#000" /> : null)}
                  </Svg>
                </View>
                <Text style={{ color: '#000', fontSize: big ? 22 : 14, marginTop: -4 }}>{value}</Text>
              </View>
            );
          }
          const Code = ({ card, big, width }) => card.type === 'qr'
            ? <View style={{ backgroundColor: '#fff', padding: big ? 20 : 5 }}><QRCode value={card.num || ' '} size={big ? width : 150} ecl="M" /></View>
            : <Barcode value={card.num} fmt={card.fmt} big={big} />;

          // ---------- shared UI (theme via context so nothing remounts while typing) ----------
          const Ctx = React.createContext(null);
          const useT = () => React.useContext(Ctx);
          const cardStyle = t => ({ backgroundColor: t.card, boxShadow: t.shadow });
          const B = ({ style, ...p }) => <Text {...p} style={[{ fontWeight: '700' }, style]} />;
          function Panel({ title, right, children }) {
            const { t } = useT();
            return (
              <View style={{ backgroundColor: t.panel, borderRadius: 30, padding: 14, marginBottom: 14 }}>
                <View style={{ flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                  <Text style={{ color: t.text, fontSize: 18, fontWeight: '800' }}>{title}</Text>{right}
                </View>
                {children}
              </View>
            );
          }
          function Link({ children, onPress }) { const { t } = useT(); return <Pressable onPress={onPress} hitSlop={8}><Text style={{ color: t.accent, fontWeight: '700', fontSize: 14 }}>{children}</Text></Pressable>; }
          function Cats({ items, value, onPick }) {
            const { t } = useT();
            return (
              <ScrollView horizontal showsHorizontalScrollIndicator={false} style={{ marginHorizontal: -14, marginBottom: 14, flexGrow: 0 }} contentContainerStyle={{ paddingHorizontal: 14, gap: 8 }}>
                {items.map(k => { const on = value === k; return (
                  <Pressable key={k} onPress={() => onPick(k)} style={{ borderWidth: 1.5, borderColor: on ? t.text : rgba(t.text, 0.75), backgroundColor: on ? t.text : 'transparent', borderRadius: 99, paddingVertical: 7, paddingHorizontal: 16 }}>
                    <Text style={{ color: on ? t.bg : t.text, fontSize: 14, fontWeight: '600', lineHeight: 19 }}>{k}</Text>
                  </Pressable>); })}
              </ScrollView>
            );
          }
          function Empty({ children }) { const { t } = useT(); return <Text style={{ textAlign: 'center', color: t.sub, paddingVertical: 28, paddingHorizontal: 10, lineHeight: 24, fontSize: 16 }}>{children}</Text>; }
          function QM() {
            const { t, showInfo } = useT();
            return (
              <Pressable onPress={showInfo} hitSlop={10} accessibilityLabel="What are Geo-alerts?" style={{ width: 18, height: 18, marginLeft: 6, borderRadius: 9, borderWidth: 1.5, borderColor: t.sub, alignItems: 'center', justifyContent: 'center' }}>
                <Text style={{ color: t.sub, fontSize: 11, fontWeight: '800', lineHeight: 13 }}>?</Text>
              </Pressable>
            );
          }
          function WalletCard({ c, last }) {
            const { openFull } = useT();
            const b = brand(c.name), tc = b.t;
            return (
              <Pressable onPress={() => openFull(c)} style={({ pressed }) => ({ marginBottom: last ? 0 : 12, borderRadius: 24, boxShadow: '0px 8px 22px rgba(0,0,0,0.18)', transform: [{ scale: pressed ? 0.98 : 1 }] })}>
                <LinearGradient colors={[b.c, mix(b.c, '#000000', 0.58)]} start={{ x: 0, y: 0 }} end={{ x: 1, y: 1 }} style={{ height: 116, borderRadius: 24, paddingVertical: 16, paddingHorizontal: 18, overflow: 'hidden' }}>
                  <Text style={{ position: 'absolute', right: -4, bottom: -44, fontSize: 170, lineHeight: 170, fontWeight: '900', color: tc, opacity: 0.14 }}>{b.l}</Text>
                  <View style={{ flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center' }}>
                    <Tile name={c.name} size={38} radius={12} font={20} translucent />
                    <Text style={{ color: tc, opacity: 0.92, fontSize: 13 }}>{b.p ? b.p + ' · ' : ''}{c.type === 'qr' ? 'QR' : 'Barcode'} ›</Text>
                  </View>
                  <Text style={{ color: tc, fontSize: 21, fontWeight: '800', marginTop: 12, lineHeight: 26 }}>{c.name}</Text>
                  <Text style={{ color: tc, opacity: 0.85, fontSize: 13 }}>•••• {c.num.slice(-4)}</Text>
                </LinearGradient>
              </Pressable>
            );
          }
          function Sec({ children }) { const { t } = useT(); return <Text style={{ fontSize: 12, color: t.sub, textTransform: 'uppercase', letterSpacing: 0.8, fontWeight: '700', marginTop: 26, marginHorizontal: 16, marginBottom: -4 }}>{children}</Text>; }
          function Group({ children }) {
            const { t } = useT();
            return <View style={[cardStyle(t), { borderRadius: 24, marginVertical: 12 }]}><View style={{ borderRadius: 24, overflow: 'hidden' }}>{children}</View></View>;
          }
          function Row({ ico, bg, title, sub, onPress, right, last, titleRight }) {
            const { t } = useT();
            return (
              <Pressable onPress={onPress} style={{ flexDirection: 'row', alignItems: 'center', gap: 14, paddingVertical: 14, paddingHorizontal: 16, borderBottomWidth: last ? 0 : 1, borderColor: t.line }}>
                {ico ? <View style={{ width: 34, height: 34, borderRadius: 11, backgroundColor: bg, alignItems: 'center', justifyContent: 'center' }}>{IC[ico] ? <Ic name={ico} /> : <Text style={{ color: '#fff', fontSize: 17 }}>{ico}</Text>}</View> : null}
                <View style={{ flex: 1, minWidth: 0 }}>
                  <View style={{ flexDirection: 'row', alignItems: 'center' }}><Text style={{ color: t.text, fontSize: 16, fontWeight: '700', flexShrink: 1 }}>{title}</Text>{titleRight}</View>
                  {sub ? <Text style={{ color: t.sub, fontSize: 13, lineHeight: 18 }}>{sub}</Text> : null}
                </View>
                {right === undefined ? <Text style={{ color: t.sub, fontSize: 16 }}>›</Text> : right}
              </Pressable>
            );
          }
          function Sim({ children, onPress, last }) {
            const { t } = useT();
            return <Pressable onPress={onPress} style={{ paddingVertical: 14, paddingHorizontal: 16, borderBottomWidth: last ? 0 : 1, borderColor: t.line }}><Text style={{ color: t.text, fontSize: 15 }}>{children}</Text></Pressable>;
          }
          function Sheet({ children, onClose }) {
            const { t, insets } = useT();
            return (
              <Modal visible transparent animationType="fade" statusBarTranslucent navigationBarTranslucent onRequestClose={onClose}>
                <KeyboardAvoidingView behavior="padding" style={{ flex: 1, backgroundColor: 'rgba(0,0,0,0.44)', justifyContent: 'flex-end', alignItems: 'center' }}>
                  <Pressable style={StyleSheet.absoluteFill} onPress={onClose} />
                  <View style={{ backgroundColor: t.bg, width: '100%', maxWidth: 480, maxHeight: '92%', borderTopLeftRadius: 32, borderTopRightRadius: 32, overflow: 'hidden' }}>
                    <ScrollView keyboardShouldPersistTaps="handled" contentContainerStyle={{ paddingTop: 20, paddingHorizontal: 18, paddingBottom: 26 + insets.bottom }}>{children}</ScrollView>
                    <Pressable onPress={onClose} hitSlop={8} style={[cardStyle(t), { position: 'absolute', top: 16, right: 16, width: 34, height: 34, borderRadius: 17, alignItems: 'center', justifyContent: 'center' }]}>
                      <Text style={{ color: t.sub, fontSize: 15 }}>✕</Text>
                    </Pressable>
                  </View>
                </KeyboardAvoidingView>
              </Modal>
            );
          }
          function H2({ children, style }) { const { t } = useT(); return <Text style={[{ color: t.text, fontSize: 26, fontWeight: '800', letterSpacing: -0.6, marginBottom: 14, paddingRight: 44, lineHeight: 32 }, style]}>{children}</Text>; }
          function Cta({ children, onPress, disabled, style }) {
            const { t } = useT();
            return (
              <Pressable disabled={disabled} onPress={onPress} style={[{ width: '100%', backgroundColor: t.accent, borderRadius: 99, padding: 17, opacity: disabled ? 0.4 : 1 }, style]}>
                <Text style={{ color: t.on, fontWeight: '800', fontSize: 17, textAlign: 'center' }}>{children}</Text>
              </Pressable>
            );
          }
          function Hero({ top, title, text }) {
            return (
              <LinearGradient colors={['#2b1b86', '#5a3df0', '#2f95ff']} locations={[0, 0.55, 1]} start={{ x: 0.33, y: 0 }} end={{ x: 0.67, y: 1 }} style={{ borderRadius: 30, paddingTop: 26, paddingHorizontal: 20, paddingBottom: 22, alignItems: 'center', overflow: 'hidden' }}>
                <View pointerEvents="none" style={{ position: 'absolute', width: 320, height: 320, borderRadius: 160, borderWidth: 1.5, borderColor: 'rgba(255,255,255,0.2)', top: '50%', left: '50%', marginTop: -160, marginLeft: -160 }} />
                <View pointerEvents="none" style={{ position: 'absolute', width: 200, height: 200, borderRadius: 100, borderWidth: 1.5, borderColor: 'rgba(255,255,255,0.27)', top: '50%', left: '50%', marginTop: -100, marginLeft: -100 }} />
                {top}
                <Text style={{ color: '#fff', fontSize: 32, fontWeight: '800', letterSpacing: -0.6, marginTop: 12, marginBottom: 6, textAlign: 'center', lineHeight: 38 }}>{title}</Text>
                <Text style={{ color: '#fff', opacity: 0.92, fontSize: 16, lineHeight: 22.4, textAlign: 'center' }}>{text}</Text>
              </LinearGradient>
            );
          }
          function Check() { const { t } = useT(); return <View style={{ width: 24, height: 24, borderRadius: 12, backgroundColor: t.accent, alignItems: 'center', justifyContent: 'center' }}><Text style={{ color: t.on, fontSize: 13 }}>✓</Text></View>; }
          function P({ children, style }) { const { t } = useT(); return <Text style={[{ color: t.text, fontSize: 14, lineHeight: 22.4, marginBottom: 6 }, style]}>{children}</Text>; }
          function H3({ children }) { const { t } = useT(); return <Text style={{ color: t.text, fontSize: 16, fontWeight: '800', marginTop: 20, marginBottom: 6 }}>{children}</Text>; }
          function Li({ children }) {
            const { t } = useT();
            return <View style={{ flexDirection: 'row', paddingLeft: 6, marginVertical: 4 }}><Text style={{ color: t.text, fontSize: 14, lineHeight: 21.7, width: 14 }}>•</Text><Text style={{ color: t.text, fontSize: 14, lineHeight: 21.7, flex: 1 }}>{children}</Text></View>;
          }

          function Main() {
            const sys = useColorScheme();
            const insets = useSafeAreaInsets();
            const [fontsLoaded] = useFonts({ PlusJakartaSans_400Regular, PlusJakartaSans_500Medium, PlusJakartaSans_600SemiBold, PlusJakartaSans_700Bold, PlusJakartaSans_800ExtraBold });
            const [ready, setReady] = useState(false);
            const [cards, setCards] = useState([]);
            const [pro, setPro] = useState(false);
            const [geo, setGeo] = useState(false);
            const [theme, setTheme] = useState('system');
            const [dev, setDev] = useState(true);
            const [reliable, setReliable] = useState(true);
            const [log, setLog] = useState([]);
            const [list, setList] = useState([]);
            const [tab, setTab] = useState('w');
            const [cat, setCat] = useState('All');
            const [act, setAct] = useState('All');
            const [sheet, setSheet] = useState(null);         // 'add' | 'pay' | 'pol' | 'info' | {choose:[...]}
            const [full, setFull] = useState(null);
            const [ask, setAsk] = useState(null);
            const [pending, setPending] = useState(null);
            const [plan, setPlan] = useState('yearly');
            const [toast, setToast] = useState('');
            const [gstat, setGstat] = useState(null);
            const [item, setItem] = useState('');
            const [onb, setOnb] = useState(false);
            const toastT = useRef(null);
            const scroll = useRef(null);
            const t = palette(theme === 'system' ? sys === 'dark' : theme === 'dark');
            const say = m => { setToast(m); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToast(''), 2600); };

            useEffect(() => { (async () => {
              const k = ['cards', 'pro', 'geo', 'theme', 'dev', 'reliable', 'log', 'list', 'onb'];
              const v = await Promise.all(k.map(x => AsyncStorage.getItem(x)));
              const j = (s, d) => { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } };
              setCards(j(v[0], [])); setPro(v[1] === '1'); setGeo(v[2] === '1'); setTheme(v[3] || 'system');
              setDev(v[4] === null ? true : v[4] === '1'); setReliable(v[5] !== '0'); setLog(j(v[6], [])); setList(j(v[7], [])); setOnb(v[8] !== '1');
              setReady(true);
            })(); }, []);
            useEffect(() => { if (!ready) return;
              AsyncStorage.multiSet([['cards', JSON.stringify(cards)], ['pro', pro ? '1' : '0'], ['geo', geo ? '1' : '0'], ['theme', theme], ['dev', dev ? '1' : '0'], ['reliable', reliable ? '1' : '0'], ['log', JSON.stringify(log)], ['list', JSON.stringify(list)]]);
            }, [cards, pro, geo, theme, dev, reliable, log, list, ready]);
            useEffect(() => { ensureChannel().catch(() => {}); }, []);

            const syncGeo = async () => {
              try { if (geo && pro && cards.length) await refreshGeofences(cards, reliable); else await stopGeo(); }
              catch (e) { console.warn('geofence', e.message); }
              setGstat(await getStatus());
            };
            // keep geofences in sync (needs Pro + toggle + at least one card)
            useEffect(() => { if (ready) syncGeo(); }, [geo, pro, cards, reliable, ready]);
            // ---- is everything set so alerts can arrive with the app closed? ----
            const [health, setHealth] = useState(null);
            const checkHealth = async () => {
              const r = { bg: false, precise: true, notif: false, battery: true };
              try { r.bg = (await Location.getBackgroundPermissionsAsync()).granted; } catch (e) {}
              try { const f = await Location.getForegroundPermissionsAsync(); r.precise = f.android ? f.android.accuracy !== 'coarse' : f.ios ? f.ios.accuracy !== 'reduced' : true; } catch (e) {}
              try { r.notif = (await Notifications.getPermissionsAsync()).granted; } catch (e) {}
              if (Platform.OS === 'android') {
                try { r.battery = !(await Battery.isBatteryOptimizationEnabledAsync()); } catch (e) {}
                if (!r.battery && (await AsyncStorage.getItem('batteryConfirmed')) === '1') r.battery = true;   // some phones (e.g. Motorola) report this wrongly
              }
              setHealth(r);
              return r;
            };
            const healthIssues = health ? ['bg', 'precise', 'notif', 'battery'].filter(k => !health[k]) : [];
            useEffect(() => { if (ready && geo && pro) checkHealth(); }, [geo, pro, ready]);
            // back in the app: pick up alerts logged in the background and retry a failed lookup
            useEffect(() => {
              const sub = AppState.addEventListener('change', async s => {
                if (s !== 'active') return;
                try { const l = JSON.parse((await AsyncStorage.getItem('log')) || '[]'); setLog(l); } catch (e) {}
                syncGeo();
                checkHealth();
              });
              return () => sub.remove();
            });
            // notification tap -> open card (also on cold start)
            useEffect(() => {
              const open = r => { const ids = r?.notification.request.content.data?.cardIds; if (ids?.length) setPending(ids); };
              Notifications.getLastNotificationResponseAsync().then(open);
              const sub = Notifications.addNotificationResponseReceivedListener(open);
              return () => sub.remove();
            }, []);
            useEffect(() => { if (!pending || !ready) return;
              (async () => { try { setLog(JSON.parse((await AsyncStorage.getItem('log')) || '[]')); } catch (e) {} })();
              const m = cards.filter(x => pending.includes(x.id));
              if (m.length === 1) openFull(m[0]); else if (m.length) setSheet({ choose: m });
              setPending(null);
            }, [pending, ready, cards]);
            // max brightness for scanners
            useEffect(() => { if (!full) return; let prev;
              (async () => { try { prev = await Brightness.getBrightnessAsync(); await Brightness.setBrightnessAsync(1); } catch (e) {} })();
              return () => { if (prev !== undefined) Brightness.setBrightnessAsync(prev).catch(() => {}); };
            }, [full]);

            const logEvt = (k, n) => setLog(l => [{ t: Date.now(), k, n }, ...l].slice(0, 200));
            const openFull = c => { setSheet(null); logEvt('used', c.name); setFull(c); };
            const confirm = (title, text, ok, fn) => setAsk({ title, text, ok, fn });
            const openAdd = () => (!pro && cards.length >= FREE_LIMIT) ? setSheet('pay') : setSheet('add');
            const saveCard = c => {
              if (!pro && cards.length >= FREE_LIMIT) return setSheet('pay');
              setCards([...cards, { id: String(Date.now()), ...c }]); logEvt('added', c.name); setSheet(null);
            };
            const delCard = c => confirm('Delete this card?', `“${c.name}” will be removed from this device.`, 'Delete', () => { logEvt('removed', c.name); setCards(cs => cs.filter(x => x.id !== c.id)); setFull(null); });
            const toggleGeo = async () => {
              if (!pro) return setSheet('pay');
              if (!geo && !(await askPermissions())) return Alert.alert('Permission needed', 'Allow location "Always" (Allow all the time) and notifications in system settings.', [{ text: 'Cancel' }, { text: 'Open settings', onPress: () => Linking.openSettings() }]);
              const turningOn = !geo;
              setGeo(!geo);
              if (turningOn) { const h = await checkHealth(); if (!h.bg || !h.precise || !h.notif || !h.battery) setSheet('health'); }
            };
            const toggleDevPro = () => { const v = !pro; setPro(v); if (!v) setGeo(false); };
            // ---- Google Play subscriptions ----
            const [plans, setPlans] = useState(null);          // prices from Google Play
            const [buying, setBuying] = useState(false);
            const applyStore = r => {                          // r: true / false / null (store not reachable)
              if (r === true) setPro(true);
              else if (r === false && !(DEV_TOOLS && dev)) { setPro(false); setGeo(false); }   // test builds keep the dev Pro switch
            };
            useEffect(() => {
              if (!ready) return;
              Billing.hasPro().then(applyStore);
              Billing.loadPlans().then(setPlans).catch(() => {});
              return Billing.listen(() => { setBuying(false); setPro(true); setSheet(null); say('Welcome to TapPass Pro!'); },
                e => { setBuying(false); say('Purchase failed: ' + String(e?.message || e).slice(0, 60)); });
            }, [ready]);
            const buyPlan = async () => {
              let ps = plans;
              if (!ps) { try { ps = await Billing.loadPlans(); setPlans(ps); } catch (e) {} }
              const p = ps && (ps[plan] || ps.monthly || ps.yearly);
              if (!p) return say('Google Play is not available right now. Try again later.');
              setBuying(true);
              try { await Billing.buy(p); } catch (e) { setBuying(false); if (e?.code !== 'user-cancelled') say('Purchase failed: ' + String(e?.message || e).slice(0, 60)); return; }
              setTimeout(() => setBuying(false), 4000);
            };
            const restore = async () => {
              say('Checking Google Play…');
              const r = await Billing.hasPro();
              if (r === true) { setPro(true); say('Purchases restored. TapPass Pro is active.'); }
              else say(r === null ? 'Google Play is not available right now.' : 'No active subscription found.');
            };
            const simulate = n => {
              if (!(pro && geo)) { if (!pro) return setSheet('pay'); return say('Turn on GPS Geo-alerts first.'); }
              const m = cardsForLabel(n, cards);
              if (!m.length) return say('You have no ' + n + ' card yet.');
              notifyNear(m.map(c => c.name)).then(() => AsyncStorage.getItem('log').then(l => l && setLog(JSON.parse(l))));
            };
            const simulateMall = () => {
              if (!(pro && geo)) { if (!pro) return setSheet('pay'); return say('Turn on GPS Geo-alerts first.'); }
              if (cards.length < 2) return say('Add at least two cards first.');
              notifyNear(cards.slice(0, 3).map(c => c.name)).then(() => AsyncStorage.getItem('log').then(l => l && setLog(JSON.parse(l))));
            };
            const refreshNow = async () => {
              say('Refreshing nearby stores…');
              try { const n = await refreshGeofences(cards, reliable); if (n >= 0) say(`Watching ${n} nearby stores`); } catch (e) { say(e.message); }
              setGstat(await getStatus());
            };
            const showLog = async () => Alert.alert('Geo log', ((await getLog()) || ['(empty)']).slice(0, 14).join('\n'));
            const geoOn = geo && pro;
            const geoStatus = !pro ? 'Pro feature' : !geo ? 'Off · tap to turn on' : healthIssues.length ? '⚠️ Needs attention' : !cards.length ? 'Add a card first' : !gstat ? 'Finding stores…'
              : gstat.err ? gstat.err
              : gstat.near ? `${gstat.near} ${gstat.near === 1 ? 'store' : 'stores'} within 1 km` : 'Watching nearby stores';
            const goTab = k => { setTab(k); scroll.current?.scrollTo({ y: 0, animated: false }); };

            // Android back button closes the top layer first
            useEffect(() => {
              const sub = BackHandler.addEventListener('hardwareBackPress', () => {
                if (ask) { setAsk(null); return true; }
                if (full) { setFull(null); return true; }
                if (sheet) { setSheet(null); return true; }
                if (tab !== 'w') { goTab('w'); return true; }
                return false;
              });
              return () => sub.remove();
            });

            if (!fontsLoaded || !ready) return <View style={{ flex: 1, backgroundColor: t.bg }} />;
            if (onb) {
              const finish = () => { AsyncStorage.setItem('onb', '1'); setOnb(false); };
              return <Ctx.Provider value={{ t, insets, showInfo: () => setSheet('info'), openFull }}><Onboarding onDone={finish} onPro={() => { finish(); setSheet('pay'); }} /></Ctx.Provider>;
            }

            // ---------- shared styles ----------
            const muted = { color: t.sub, fontSize: 14, lineHeight: 19.6 };
            const card = { backgroundColor: t.card, boxShadow: t.shadow };
            const h1 = txt => <Text style={{ color: t.text, fontSize: 34, fontWeight: '800', letterSpacing: -0.8, marginTop: 10, marginBottom: 4, lineHeight: 41 }}>{txt}</Text>;
            const geoRow = (
              <Group><Row ico="pin" bg="#007aff" title="GPS Geo-alerts" titleRight={<>{pro ? null : <View style={{ marginLeft: 5 }}><Ic name="lock" size={14} color={t.sub} width={2.2} /></View>}<QM /></>} sub="Show your card automatically near a store" onPress={toggleGeo} right={<Sw on={geoOn} />} last /></Group>
            );

            // ---------- views ----------
            const viewWallet = () => {
              const n = cards.length;
              const cats = ['All', ...new Set(cards.map(c => catOf(c.name)))];
              const cc = cats.includes(cat) ? cat : 'All';
              const shown = cards.filter(c => cc === 'All' || catOf(c.name) === cc);
              return <>
                <View style={{ paddingTop: 6, paddingBottom: 4 }}>
                  <View style={{ flexDirection: 'row', alignItems: 'center', gap: 10 }}>
                    <Text style={{ color: t.text, fontSize: 36, fontWeight: '800', letterSpacing: -1.4, lineHeight: 40 }}>tappass</Text>
                    <Pressable onPress={() => setSheet('pay')} style={{ marginTop: 5 }}>
                      {pro
                        ? <LinearGradient colors={['#ff9f0a', '#ff375f']} start={{ x: 0, y: 0 }} end={{ x: 1, y: 0 }} style={{ borderRadius: 99, paddingVertical: 5, paddingHorizontal: 11, boxShadow: t.shadow }}><Text style={{ color: '#fff', fontSize: 11, fontWeight: '800', letterSpacing: 0.5 }}>PRO</Text></LinearGradient>
                        : <View style={[card, { borderRadius: 99, paddingVertical: 5, paddingHorizontal: 11 }]}><Text style={{ color: t.text, fontSize: 11, fontWeight: '800', letterSpacing: 0.5 }}>FREE</Text></View>}
                    </Pressable>
                  </View>
                  <Text style={[muted, { marginTop: 4 }]}>Every loyalty card in one place.</Text>
                </View>
                <View style={{ flexDirection: 'row', gap: 10, marginTop: 14, marginBottom: 12 }}>
                  <View style={[card, { flex: 1, borderRadius: 20, minHeight: 66, paddingVertical: 11, paddingHorizontal: 14, flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between' }]}>
                    <View pointerEvents="none" style={[StyleSheet.absoluteFill, { borderRadius: 20, overflow: 'hidden' }]}><Orb size={72} style={{ right: -20, bottom: -26 }} /></View>
                    <View style={{ gap: 2 }}>
                      <Text style={{ color: t.text, fontSize: 13, fontWeight: '700' }}>Cards</Text>
                      <Text numberOfLines={1} style={{ color: t.sub, fontSize: 12 }}>{pro ? 'Unlimited' : 'of ' + FREE_LIMIT + ' free'}</Text>
                    </View>
                    <Text style={{ color: t.text, fontSize: 28, fontWeight: '800', letterSpacing: -1 }}>{n}</Text>
                  </View>
                  <Pressable onPress={toggleGeo} style={[card, { flex: 1, borderRadius: 20, minHeight: 66, paddingVertical: 11, paddingHorizontal: 14, flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', gap: 4 }]}>
                    <View style={{ flex: 1, gap: 2, minWidth: 0 }}>
                      <View style={{ flexDirection: 'row', alignItems: 'center' }}><Text style={{ color: t.text, fontSize: 13, fontWeight: '700' }}>Geo-alerts</Text>{pro ? null : <View style={{ marginLeft: 4 }}><Ic name="lock" size={12} color={t.sub} width={2.2} /></View>}<QM /></View>
                      <Text numberOfLines={1} style={{ color: t.sub, fontSize: 12 }}>{geoStatus}</Text>
                    </View>
                    <Sw on={geoOn} s={0.72} />
                  </Pressable>
                </View>
                {geo && pro && healthIssues.length > 0 && (
                  <Pressable onPress={() => setSheet('health')} style={{ flexDirection: 'row', alignItems: 'center', gap: 12, backgroundColor: '#ff9500', borderRadius: 20, paddingVertical: 12, paddingHorizontal: 14, marginBottom: 12 }}>
                    <Ic name="alert" size={24} />
                    <View style={{ flex: 1 }}>
                      <B style={{ color: '#fff', fontSize: 15 }}>Geo-alerts may not work</B>
                      <Text style={{ color: '#fff', fontSize: 13, opacity: 0.95 }}>{healthIssues.length === 1 ? '1 setting needs' : healthIssues.length + ' settings need'} your attention. Tap to fix.</Text>
                    </View>
                    <Text style={{ color: '#fff', fontSize: 18 }}>›</Text>
                  </Pressable>)}
                <Panel title="My cards" right={<Link onPress={openAdd}>+ Add Card</Link>}>
                  {n ? <Cats items={cats} value={cc} onPick={setCat} /> : null}
                  {shown.length ? shown.map((c, i) => <WalletCard key={c.id} c={c} last={i === shown.length - 1} />) : <Empty>No cards yet.{'\n'}Tap “+ Add Card” to start.</Empty>}
                </Panel>
                {!pro && (
                  <Pressable onPress={() => setSheet('pay')} style={{ marginBottom: 14 }}>
                    <LinearGradient colors={['#ff9f0a', '#ff375f']} start={{ x: 0, y: 0.2 }} end={{ x: 1, y: 0.8 }} style={{ borderRadius: 24, paddingVertical: 16, paddingHorizontal: 18 }}>
                      <B style={{ color: '#fff', fontSize: 17 }}>✨ Go Pro</B>
                      <Text style={{ color: '#fff', fontSize: 13, opacity: 0.95 }}>Unlimited cards and GPS Geo-alerts. 14 days free.</Text>
                    </LinearGradient>
                  </Pressable>)}
              </>;
            };

            const AK = { used: ['receipt', '#34c759', 'Card shown at checkout'], alert: ['pin', '#007aff', 'Geo-alert near store'], added: ['plus', '#5a3df0', 'Card added'], removed: ['trash', '#ff3b30', 'Card removed'] };
            const dayLabel = ts => { const d = new Date(ts), n = new Date(), st = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(), diff = Math.round((st(n) - st(d)) / 864e5);
              return diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }); };
            const viewActivity = () => {
              const f = act;
              const match = e => f === 'All' || (f === 'Used' && e.k === 'used') || (f === 'Alerts' && e.k === 'alert') || (f === 'Changes' && (e.k === 'added' || e.k === 'removed'));
              const items = log.filter(match), d0 = new Date(), today = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate()).getTime();
              const days = [...Array(7)].map((_, i) => { const st = today - (6 - i) * 864e5; return { c: log.filter(e => e.k === 'used' && e.t >= st && e.t < st + 864e5).length, l: new Date(st).toLocaleDateString('en-US', { weekday: 'short' })[0] }; });
              const max = Math.max(1, ...days.map(d => d.c)), week = days.reduce((a, d) => a + d.c, 0);
              const cnt = {}; log.filter(e => e.k === 'used').forEach(e => { cnt[e.n] = (cnt[e.n] || 0) + 1; });
              const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
              const groups = []; items.forEach(e => { const l = dayLabel(e.t); let g = groups[groups.length - 1]; if (!g || g.l !== l) { g = { l, i: [] }; groups.push(g); } g.i.push(e); });
              const stat = { flex: 1, borderRadius: 26, padding: 16, minHeight: 152, gap: 4 };
              return <>
                {h1('Activity')}<Text style={muted}>Everything that happens with your cards.</Text>
                <View style={{ flexDirection: 'row', gap: 12, marginTop: 18, marginBottom: 14 }}>
                  <View style={[card, stat]}>
                    <Text style={{ color: t.text, fontSize: 15, fontWeight: '700' }}>This week</Text>
                    <View style={{ flexDirection: 'row', gap: 6, alignItems: 'flex-end', height: 84, marginTop: 10 }}>
                      {days.map((d, i) => { const h = Math.max(8, Math.round(d.c / max * 60)); return (
                        <View key={i} style={{ flex: 1, alignItems: 'center', gap: 4, justifyContent: 'flex-end' }}>
                          {d.c ? <LinearGradient colors={['#ff8a3d', '#ff5a1f']} style={{ width: '100%', maxWidth: 14, height: h, borderRadius: 99 }} />
                            : <View style={{ width: '100%', maxWidth: 14, height: h, borderRadius: 99, backgroundColor: rgba(t.text, 0.14) }} />}
                          <Text style={{ fontSize: 10, color: t.sub }}>{d.l}</Text>
                        </View>); })}
                    </View>
                    <Text style={muted}><B style={{ color: t.text }}>{week}</B> {week === 1 ? 'time' : 'times'} used</Text>
                  </View>
                  <View style={[card, stat]}>
                    <View pointerEvents="none" style={[StyleSheet.absoluteFill, { borderRadius: 26, overflow: 'hidden' }]}><Orb size={110} style={{ right: -34, top: -34 }} /></View>
                    <Text style={{ color: t.text, fontSize: 15, fontWeight: '700' }}>Most used</Text>
                    {top ? <>
                      <View style={{ marginTop: 10 }}><Tile name={top[0]} /></View>
                      <Text style={{ color: t.text, fontSize: 20, fontWeight: '800', letterSpacing: -0.5, marginTop: 'auto' }} numberOfLines={1}>{top[0]}</Text>
                      <Text style={muted}>{top[1]} {top[1] === 1 ? 'time' : 'times'}</Text>
                    </> : <Text style={[muted, { marginTop: 'auto' }]}>Nothing yet</Text>}
                  </View>
                </View>
                <Panel title="History" right={<Text style={muted}>{items.length} {items.length === 1 ? 'event' : 'events'}</Text>}>
                  <Cats items={['All', 'Used', 'Alerts', 'Changes']} value={f} onPick={setAct} />
                  {groups.length ? groups.map((g, gi) => <View key={g.l + gi}>
                    <Text style={{ fontSize: 12, fontWeight: '800', color: t.sub, textTransform: 'uppercase', letterSpacing: 0.6, marginTop: gi ? 16 : 0, marginBottom: 2 }}>{g.l}</Text>
                    {g.i.map((e, i) => { const [ic, bg, lb] = AK[e.k] || AK.used; return (
                      <View key={e.t + e.k + i} style={{ flexDirection: 'row', alignItems: 'center', gap: 12, paddingVertical: 10, borderBottomWidth: i === g.i.length - 1 ? 0 : 1, borderColor: rgba(t.text, 0.08) }}>
                        <Tile name={e.n} size={40} radius={12} font={20} />
                        <View style={{ flex: 1 }}>
                          <B style={{ color: t.text, fontSize: 16 }}>{e.n}</B>
                          <Text style={{ fontSize: 13, color: t.sub }}>{lb} · {new Date(e.t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</Text>
                        </View>
                        <View style={{ width: 30, height: 30, borderRadius: 10, backgroundColor: bg, alignItems: 'center', justifyContent: 'center' }}><Ic name={ic} size={16} /></View>
                      </View>); })}
                  </View>) : <Empty>No activity yet.{'\n'}Open a card at checkout and it shows up here.</Empty>}
                </Panel>
                <Text style={{ fontSize: 13, color: t.sub, marginVertical: 6, marginHorizontal: 16, textAlign: 'center', lineHeight: 18 }}>TapPass records when you open cards and get alerts. It never sees your purchases or spending.</Text>
              </>;
            };

            const addItem = () => { const v = item.trim(); if (!v) return; setList(l => [{ id: Date.now(), t: v.slice(0, 80), d: false }, ...l]); setItem(''); };
            const viewList = () => {
              const left = list.filter(x => !x.d).length, sorted = list.slice().sort((a, b) => a.d - b.d);
              return <>
                {h1('Shopping list')}<Text style={muted}>{left ? left + ' left to buy' : list.length ? 'Everything bought 🎉' : 'Nothing here yet'}</Text>
                <View style={{ flexDirection: 'row', gap: 10, marginTop: 16, marginBottom: 14 }}>
                  <TextInput value={item} onChangeText={setItem} placeholder="Add an item…" placeholderTextColor={t.sub} returnKeyType="done" blurOnSubmit={false} onSubmitEditing={addItem}
                    style={{ flex: 1, fontSize: 16, paddingVertical: 14, paddingHorizontal: 16, borderRadius: 16, borderWidth: 1.5, borderColor: t.line, backgroundColor: t.card, color: t.text }} />
                  <Pressable onPress={addItem} accessibilityLabel="Add item" style={{ width: 54, borderRadius: 16, backgroundColor: t.accent, alignItems: 'center', justifyContent: 'center' }}>
                    <Icon d="M12 5v14M5 12h14" size={26} color={t.on} width={2.6} />
                  </Pressable>
                </View>
                <Panel title="To buy" right={list.some(x => x.d) ? <Link onPress={() => { const n = list.filter(i => i.d).length; confirm('Clear checked items?', `${n} checked ${n === 1 ? 'item' : 'items'} will be removed.`, 'Clear', () => setList(l => l.filter(i => !i.d))); }}>Clear checked</Link> : <Text style={muted}>{list.length} {list.length === 1 ? 'item' : 'items'}</Text>}>
                  {list.length ? sorted.map((x, i) => (
                    <View key={x.id} style={{ flexDirection: 'row', alignItems: 'center', gap: 12, paddingVertical: 12, paddingHorizontal: 4, borderBottomWidth: i === sorted.length - 1 ? 0 : 1, borderColor: rgba(t.text, 0.08) }}>
                      <Pressable onPress={() => setList(l => l.map(y => y.id === x.id ? { ...y, d: !y.d } : y))} accessibilityLabel="Mark as bought" style={{ width: 28, height: 28, borderRadius: 14, borderWidth: 2, borderColor: x.d ? t.green : rgba(t.text, 0.35), backgroundColor: x.d ? t.green : 'transparent', alignItems: 'center', justifyContent: 'center' }}>
                        {x.d ? <Icon d="M5 12.5l4.5 4.5L19 7.5" size={16} color="#fff" width={3} /> : null}
                      </Pressable>
                      <Text onPress={() => setList(l => l.map(y => y.id === x.id ? { ...y, d: !y.d } : y))} style={{ flex: 1, fontSize: 16, fontWeight: x.d ? '500' : '600', color: x.d ? t.sub : t.text, textDecorationLine: x.d ? 'line-through' : 'none' }}>{x.t}</Text>
                      <Pressable onPress={() => confirm('Delete item?', `“${x.t}” will be removed from your list.`, 'Delete', () => setList(l => l.filter(y => y.id !== x.id)))} hitSlop={6} style={{ padding: 6 }} accessibilityLabel="Delete item">
                        <Icon d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" size={20} color={t.sub} width={1.8} />
                      </Pressable>
                    </View>)) : <Empty>Your list is empty.{'\n'}Add what you need to buy.</Empty>}
                </Panel>
              </>;
            };

            const viewSettings = () => <>
              {h1('Settings')}
              <Sec>Subscription</Sec>
              <Group>
                <Row ico="star" bg="#ff9f0a" title={pro ? 'TapPass Pro' : 'Upgrade to Pro'} sub={pro ? 'Active · unlimited cards' : '14 days free, then from $2.99/month'} onPress={() => setSheet('pay')} />
                <Row ico="refresh" bg="#007aff" title="Restore Purchases" onPress={restore} last={!pro} />
                {pro && <Row ico="gear" bg="#8e8e93" title="Manage Subscription" sub="App Store / Google Play" onPress={async () => { if (!(await Billing.manage())) say('Open Google Play → Payments & subscriptions'); }} last />}
              </Group>
              <Sec>Preferences</Sec>
              {geoRow}
              {geoOn && <Group><Row ico={healthIssues.length ? 'alert' : 'check'} bg={healthIssues.length ? '#ff9500' : '#34c759'} title="Alert reliability check" sub={healthIssues.length ? healthIssues.length + ' setting(s) need attention' : 'Everything is set'} onPress={() => { checkHealth(); setSheet('health'); }} last /></Group>}
              {Platform.OS === 'android' && geoOn && <Group>
                <Row ico="battery" bg="#ff9500" title="Reliable mode" sub="Keeps a small notification so Android doesn’t stop alerts" onPress={() => setReliable(!reliable)} right={<Sw on={reliable} />} />
                <Row ico="gear" bg="#8e8e93" title="Battery & background" sub="Set TapPass battery usage to Unrestricted" onPress={() => Linking.openSettings()} last />
              </Group>}
              <Group>
                <View style={{ paddingVertical: 14, paddingHorizontal: 16 }}>
                  <View style={{ flexDirection: 'row', alignItems: 'center', gap: 14 }}>
                    <View style={{ width: 34, height: 34, borderRadius: 11, backgroundColor: '#5856d6', alignItems: 'center', justifyContent: 'center' }}><Ic name="theme" /></View>
                    <Text style={{ color: t.text, fontSize: 16, fontWeight: '700' }}>Appearance</Text>
                  </View>
                  <View style={{ flexDirection: 'row', backgroundColor: t.line, borderRadius: 14, padding: 3, marginTop: 12 }}>
                    {['system', 'light', 'dark'].map(k => (
                      <Pressable key={k} onPress={() => setTheme(k)} style={{ flex: 1, padding: 9, borderRadius: 11, backgroundColor: theme === k ? t.card : 'transparent', boxShadow: theme === k ? '0px 1px 4px rgba(0,0,0,0.2)' : undefined }}>
                        <Text style={{ textAlign: 'center', color: t.text, fontSize: 14, fontWeight: theme === k ? '700' : '500' }}>{k[0].toUpperCase() + k.slice(1)}</Text>
                      </Pressable>))}
                  </View>
                </View>
              </Group>
              <Sec>Support</Sec>
              <Group>
                <Row ico="mail" bg="#34c759" title="Contact Support" sub="support@tappass.app" onPress={() => Linking.openURL('mailto:support@tappass.app').catch(() => say('Opens your mail app'))} />
                <Row ico="star" bg="#ff9f0a" title="Rate TapPass" onPress={() => say('Opens the store review page')} />
                <Row ico="doc" bg="#8e8e93" title="Terms of Use" onPress={() => say('Opens terms of use')} last />
              </Group>
              <Sec>Privacy</Sec>
              <Group><Row ico="lock" bg="#8e8e93" title="Privacy Policy" sub="How we use and share data" onPress={() => setSheet('pol')} last /></Group>
              <Sec>Data</Sec>
              <Group>
                <Row ico="clock" bg="#ff9500" title="Clear Activity History" sub={log.length + ' events'} onPress={() => confirm('Clear activity history?', 'All activity entries will be removed.', 'Clear', () => setLog([]))} />
                <Row ico="trash" bg="#ff3b30" title="Delete All Cards" sub={cards.length + ' saved on this device'} onPress={() => cards.length && confirm('Delete all cards?', 'All cards will be removed from this device.', 'Delete all', () => setCards([]))} last />
              </Group>
              {DEV_TOOLS && <>
                <Sec>Developer</Sec>
                <Group><Row ico="tool" bg="#636366" title="Developer mode" sub="Test tools. Remove in the production build." onPress={() => setDev(!dev)} right={<Sw on={dev} />} last /></Group>
                {dev && <Group>
                  <Row title="Dev Mode: Toggle Pro Status" sub={pro ? 'Pro is ON' : 'Pro is OFF'} onPress={toggleDevPro} right={<Sw on={pro} />} />
                  {geoOn && <Row title="Geo-alerts status" sub={gstat?.stale ? `${gstat.count} saved stores · ${gstat.stale}` : gstat?.nearest ? `Watching ${gstat.count} stores · nearest: ${gstat.nearest.name}, ${gstat.nearest.d} m` : geoStatus} onPress={refreshNow} right={<Text style={{ color: t.accent, fontSize: 13, fontWeight: '700' }}>Refresh</Text>} />}
                  <Text style={{ paddingTop: 12, paddingHorizontal: 14, paddingBottom: 4, color: t.sub, fontSize: 13 }}>Geofencing simulator (needs Pro and Geo-alerts ON)</Text>
                  <Sim onPress={() => cards.length ? notifyNear([cards[0].name]) : say('Add a card first')}>🔔 Send test notification</Sim>
                  <Sim onPress={showLog}>📜 Show geo log</Sim>
                  <Sim onPress={async () => Alert.alert('Scan log', (JSON.parse((await AsyncStorage.getItem('scanLog')) || '[]')).slice(0, 14).join('\n') || '(empty)')}>📷 Show scan log</Sim>
                  <Sim onPress={() => setOnb(true)}>👋 Show welcome screens again</Sim>
                  {SIM.map(n => <Sim key={n} onPress={() => simulate(n)}>📍 Simulate: Walking into {n}</Sim>)}
                  <Sim onPress={simulateMall} last>🏬 Simulate: Mall with several of my stores</Sim>
                </Group>}
              </>}
              <Text style={{ fontSize: 12, color: t.sub, textAlign: 'center', marginTop: 6 }}>Store locations © OpenStreetMap contributors</Text>
              <Text style={{ fontSize: 13, color: t.sub, textAlign: 'center', marginTop: 6 }}>TapPass 1.0.0</Text>
            </>;

            // ---------- bottom sheets ----------
            const devPro = DEV_TOOLS && dev && <View style={{ marginTop: 12 }}><Group><Row title="Dev Mode: Toggle Pro Status" sub={pro ? 'Pro is ON' : 'Pro is OFF'} onPress={toggleDevPro} right={<Sw on={pro} />} last /></Group></View>;

            const paywall = () => <Sheet onClose={() => setSheet(null)}>
              <Hero top={<View style={{ boxShadow: '0px 10px 20px rgba(0,0,0,0.38)', borderRadius: 19 }}><Logo size={84} /></View>} title="Try 14 Days Free" text="Never search for your loyalty card at the checkout again." />
              <View style={{ marginVertical: 18, marginHorizontal: 4 }}>
                {[['Unlimited cards'], ['GPS Geo-alerts at your favorite stores', true], ['Cancel anytime']].map(([l, q]) => (
                  <View key={l} style={{ flexDirection: 'row', gap: 12, alignItems: 'center', paddingVertical: 7 }}><Check /><Text style={{ color: t.text, fontWeight: '600', fontSize: 16, flexShrink: 1 }}>{l}</Text>{q && <QM />}</View>))}
              </View>
              {(() => {
                const m = plans?.monthly, y = plans?.yearly;
                const save = m && y && m.micros && y.micros ? Math.round((1 - y.micros / (m.micros * 12)) * 100) : 45;
                const rows = [['monthly', 'Monthly', m ? m.price + ' / month' : '$2.99 / month', m], ['yearly', 'Yearly', y ? y.price + ' / year' : '$19.99 / year', y]];
                const sel = plan === 'yearly' ? y : m, trial = sel ? sel.trial : true;
                return <>
                  {rows.map(([k, name, price, p]) => (
                    <Pressable key={k} onPress={() => setPlan(k)} style={{ backgroundColor: t.card, borderWidth: 2, borderColor: plan === k ? t.accent : t.line, borderRadius: 22, paddingVertical: 15, paddingHorizontal: 16, marginVertical: 10 }}>
                      {k === 'yearly' && save > 0 && <View style={{ position: 'absolute', right: 14, top: -11, backgroundColor: '#ff9f0a', paddingVertical: 4, paddingHorizontal: 10, borderRadius: 99 }}><Text style={{ color: '#fff', fontSize: 12, fontWeight: '800' }}>Save {save}%</Text></View>}
                      <B style={{ color: t.text, fontSize: 16 }}>{name} - {price}</B><Text style={{ color: t.sub, fontSize: 14, marginTop: 2 }}>{!p || p.trial ? '(after 14-day free trial)' : 'Billed ' + (k === 'yearly' ? 'yearly' : 'monthly')}</Text>
                    </Pressable>))}
                  <Cta style={{ marginTop: 6 }} disabled={buying} onPress={buyPlan}>{buying ? 'Opening Google Play…' : trial ? 'Start 14-Day Free Trial' : 'Subscribe'}</Cta>
                  <Text style={{ fontSize: 12, color: t.sub, textAlign: 'center', marginTop: 12, lineHeight: 17 }}>
                    {trial ? `Free for 14 days, then ${sel ? sel.price : (plan === 'yearly' ? '$19.99' : '$2.99')} per ${plan === 'yearly' ? 'year' : 'month'}. ` : ''}Renews automatically until cancelled. Cancel anytime in Google Play at least 24 hours before renewal.
                  </Text>
                </>;
              })()}
              <View style={{ flexDirection: 'row', justifyContent: 'center', gap: 18, marginTop: 8 }}>
                {[['Restore Purchases', restore], ['Terms', () => say('Opens terms of use')], ['Privacy', () => setSheet('pol')]].map(([l, f]) => <Text key={l} onPress={f} style={{ color: t.accent, fontSize: 13, fontWeight: '600' }}>{l}</Text>)}
              </View>
              {devPro}
            </Sheet>;

            const geoInfo = () => <Sheet onClose={() => setSheet(null)}>
              <Hero top={<Text style={{ fontSize: 40 }}>📍</Text>} title="GPS Geo-alerts" text="Your card appears the moment you arrive at a store." />
              <H3>The idea</H3>
              <P>You are at the checkout, the queue is moving, and you are still scrolling for the right loyalty card. Geo-alerts removes that moment. When you walk up to a store whose card you saved, TapPass sends you a notification. One tap opens the code full screen, ready to scan.</P>
              <View style={[card, { flexDirection: 'row', gap: 12, alignItems: 'center', borderRadius: 20, paddingVertical: 12, paddingHorizontal: 14, marginVertical: 10 }]}>
                <Tile name="Tesco" />
                <View style={{ flex: 1 }}><Text style={{ color: t.sub, fontSize: 12 }}>TAPPASS · now</Text><Text style={{ color: t.text, fontSize: 14 }}>📍 You are near Tesco! Tap to open your card.</Text></View>
              </View>
              <H3>How it works</H3>
              {[['Add your cards', 'Geo-alerts only watches stores whose card you saved.'], ['Turn it on', 'Allow location (“Always”) and notifications when your phone asks.'],
                ['We find stores near you', 'TapPass looks up the nearest locations of your chains and keeps watching the closest ones. The list refreshes as you move around.'],
                ['You arrive', 'Within about 150 metres of the store you get the alert, even when your phone is locked and the app is closed.'], ['Tap and scan', 'The code opens full screen at maximum brightness.']].map(([b, x], i) => (
                <View key={b} style={{ flexDirection: 'row', gap: 12, alignItems: 'flex-start', paddingVertical: 8 }}>
                  <View style={{ width: 26, height: 26, borderRadius: 13, backgroundColor: t.accent, alignItems: 'center', justifyContent: 'center' }}><Text style={{ color: t.on, fontSize: 13, fontWeight: '800' }}>{i + 1}</Text></View>
                  <View style={{ flex: 1 }}><B style={{ color: t.text, fontSize: 15 }}>{b}</B><Text style={{ color: t.text, fontSize: 14, lineHeight: 21 }}>{x}</Text></View>
                </View>))}
              <H3>Good to know</H3>
              <Li>You get one alert per store every 4 hours, so there is no spam.</Li>
              <Li>If you enter a mall with several of your stores, you get a single notification and choose the card.</Li>
              <Li>Alerts can take a minute or two to arrive. This is normal for phone location services.</Li>
              <Li>Stores are saved on your phone, so alerts still work in a store with no signal.</Li>
              <Li>On Android, a small “watching for nearby stores” notification can stay visible. It keeps the system from stopping alerts and can be switched off in Settings.</Li>
              <Li>For best results set battery usage for TapPass to “Unrestricted”.</Li>
              <H3>Your privacy</H3>
              <P>Your location is used to detect nearby stores. To find them, the app sends your approximate position and the names of your chains to a map service (OpenStreetMap). TapPass never sees what you buy or spend. You can turn Geo-alerts off at any time and alerts stop immediately. <Text onPress={() => setSheet('pol')} style={{ color: t.accent, fontSize: 13, fontWeight: '600' }}>Read the Privacy Policy</Text></P>
              <H3>Availability</H3>
              <P>Geo-alerts is a Pro feature. Try it free for 14 days.</P>
              {!pro ? <Cta style={{ marginTop: 12 }} onPress={() => setSheet('pay')}>Try 14 Days Free</Cta> : !geoOn ? <Cta style={{ marginTop: 12 }} onPress={() => { setSheet(null); toggleGeo(); }}>Turn on Geo-alerts</Cta> : null}
              <Pressable onPress={() => setSheet(null)} style={{ width: '100%', padding: 14 }}><Text style={{ color: t.sub, fontWeight: '700', textAlign: 'center', fontSize: 16 }}>Got it</Text></Pressable>
            </Sheet>;

            const rich = (s, k) => s.split(/(<b>[\s\S]*?<\/b>|<span class="ph">[\s\S]*?<\/span>)/).filter(Boolean).map((x, i) =>
              x.startsWith('<b>') ? <B key={k + i}>{x.slice(3, -4)}</B>
                : x.startsWith('<span') ? <Text key={k + i} style={{ backgroundColor: '#ffe08a', color: '#000' }}> {x.replace(/<[^>]+>/g, '')} </Text>
                : x.replace(/<[^>]+>/g, ''));
            const policy = () => <Sheet onClose={() => setSheet(null)}>
              <H2 style={{ marginBottom: 4 }}>Privacy Policy</H2>
              {[...POLICY.matchAll(/<(h3|p|li)([^>]*)>([\s\S]*?)<\/\1>/g)].map((m, i) => m[1] === 'h3' ? <H3 key={i}>{rich(m[3], i)}</H3>
                : m[1] === 'li' ? <Li key={i}>{rich(m[3], i)}</Li>
                : <P key={i} style={m[2].includes('muted') ? { color: t.sub } : null}>{rich(m[3], i)}</P>)}
            </Sheet>;

            const chooser = cs => <Sheet onClose={() => setSheet(null)}>
              <H2>Stores nearby</H2>
              <Text style={[muted, { marginTop: -6, marginBottom: 16 }]}>Pick the card to show at checkout.</Text>
              {cs.filter(c => cards.some(x => x.id === c.id)).map((c, i, a) => <WalletCard key={c.id} c={c} last={i === a.length - 1} />)}
            </Sheet>;

            const openBattery = async () => {
              try { await Linking.sendIntent('android.settings.IGNORE_BATTERY_OPTIMIZATION_SETTINGS'); } catch (e) { Linking.openSettings(); }
            };
            const healthSheet = () => {
              const h = health || {};
              const items = [
                ['bg', 'pin', 'Location: “Allow all the time”', 'Needed so TapPass can notice a store while the app is closed.', 'Open settings', () => Linking.openSettings()],
                ['precise', 'target', 'Precise location', 'Approximate location can be off by 1–3 km, which is too far to spot a store.', 'Open settings', () => Linking.openSettings()],
                ['notif', 'bell', 'Notifications allowed', 'Without them the alert cannot appear.', 'Open settings', () => Linking.openSettings()],
                ...(Platform.OS === 'android' ? [['battery', 'battery', 'Battery: “Don’t optimise”', 'Your phone may pause TapPass to save battery, and then alerts stop. Tap the button, switch the list to “All apps”, find TapPass and choose “Don’t optimise”. (“Allow background usage” alone is not enough on some phones.)', 'Open battery optimisation', openBattery]] : []),
              ];
              return <Sheet onClose={() => setSheet(null)}>
                <H2>Make alerts reliable</H2>
                <Text style={[muted, { marginTop: -6, marginBottom: 14 }]}>Geo-alerts work in the background, so your phone has to allow it. Fix anything marked below, then come back to TapPass.</Text>
                {items.map(([k, ico, title, text, btn, fn]) => { const ok = !!h[k]; return (
                  <View key={k} style={[card, { borderRadius: 20, padding: 14, marginBottom: 10 }]}>
                    <View style={{ flexDirection: 'row', alignItems: 'center', gap: 12 }}>
                      <Ic name={ico} size={22} color={t.accent} />
                      <B style={{ flex: 1, color: t.text, fontSize: 15 }}>{title}</B>
                      <View style={{ width: 26, height: 26, borderRadius: 13, backgroundColor: ok ? t.green : '#ff3b30', alignItems: 'center', justifyContent: 'center' }}><Text style={{ color: '#fff', fontSize: 13, fontWeight: '800' }}>{ok ? '✓' : '!'}</Text></View>
                    </View>
                    {!ok && <>
                      <Text style={{ color: t.sub, fontSize: 13, lineHeight: 18, marginTop: 8 }}>{text}</Text>
                      <Pressable onPress={fn} style={{ marginTop: 10, alignSelf: 'flex-start', backgroundColor: t.accent, borderRadius: 99, paddingVertical: 9, paddingHorizontal: 16 }}><B style={{ color: t.on, fontSize: 14 }}>{btn}</B></Pressable>
                      {k === 'battery' && <Pressable onPress={async () => { await AsyncStorage.setItem('batteryConfirmed', '1'); checkHealth(); }} style={{ marginTop: 6, alignSelf: 'flex-start', paddingVertical: 8 }}><B style={{ color: t.accent, fontSize: 13 }}>I’ve already done this</B></Pressable>}
                    </>}
                  </View>); })}
                {healthIssues.length === 0 && <Text style={{ color: t.green, fontWeight: '700', textAlign: 'center', marginVertical: 8, fontSize: 15 }}>All set. Alerts will reach you even with the app closed.</Text>}
                <Pressable onPress={() => { checkHealth(); }} style={{ width: '100%', padding: 14 }}><Text style={{ color: t.accent, fontWeight: '700', textAlign: 'center', fontSize: 15 }}>Check again</Text></Pressable>
              </Sheet>;
            };

            const tabs = [['w', 'Wallet'], ['a', 'Activity'], ['l', 'List'], ['s', 'Settings']];
            return (
              <Ctx.Provider value={{ t, insets, showInfo: () => setSheet('info'), openFull }}>
              <View style={{ flex: 1, backgroundColor: t.bg }}>
                <StatusBar style={t.dark ? 'light' : 'dark'} />
                <ScrollView ref={scroll} keyboardShouldPersistTaps="handled" contentContainerStyle={{ width: '100%', maxWidth: 480, alignSelf: 'center', paddingTop: 16 + insets.top, paddingHorizontal: 12, paddingBottom: 130 + insets.bottom }}>
                  {tab === 'w' ? viewWallet() : tab === 'a' ? viewActivity() : tab === 'l' ? viewList() : viewSettings()}
                </ScrollView>

                {toast ? <View pointerEvents="none" style={{ position: 'absolute', left: 0, right: 0, bottom: 104 + insets.bottom, alignItems: 'center' }}>
                  <Text style={{ backgroundColor: 'rgba(30,30,32,0.94)', color: '#fff', paddingHorizontal: 18, paddingVertical: 10, borderRadius: 99, overflow: 'hidden', fontSize: 14 }}>{toast}</Text></View> : null}

                <View style={{ position: 'absolute', left: 0, right: 0, bottom: 14 + insets.bottom, alignItems: 'center' }}>
                  <View style={{ width: '100%', maxWidth: 480, paddingHorizontal: 12 }}>
                    <View style={{ flexDirection: 'row', gap: 2, backgroundColor: t.card, borderRadius: 30, padding: 6, boxShadow: '0px 12px 32px rgba(30,30,70,0.2)' }}>
                      {tabs.map(([k, l]) => { const on = tab === k; return (
                        <Pressable key={k} onPress={() => goTab(k)} accessibilityLabel={l} style={{ flex: on ? 1.7 : 1, flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: 6, height: 46, minWidth: 44, borderRadius: 22, paddingHorizontal: 10, backgroundColor: on ? t.text : 'transparent' }}>
                          {TAB_ICON[k](on ? t.bg : t.sub)}
                          {on && <Text style={{ color: t.bg, fontSize: 13, fontWeight: '700' }} numberOfLines={1}>{l}</Text>}
                        </Pressable>); })}
                    </View>
                  </View>
                </View>

                {sheet === 'add' && <AddCard onClose={() => setSheet(null)} onSave={saveCard} say={say} />}
                {sheet === 'pay' && paywall()}
                {sheet === 'info' && geoInfo()}
                {sheet === 'pol' && policy()}
                {sheet === 'health' && healthSheet()}
                {sheet && sheet.choose && chooser(sheet.choose)}

                <Modal visible={!!ask} transparent animationType="fade" statusBarTranslucent onRequestClose={() => setAsk(null)}>
                  <View style={{ flex: 1, backgroundColor: 'rgba(0,0,0,0.44)', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
                    {ask && <View style={[card, { borderRadius: 28, padding: 22, width: '100%', maxWidth: 340 }]}>
                      <Text style={{ color: t.text, fontSize: 20, fontWeight: '800', marginBottom: 6 }}>{ask.title}</Text>
                      <Text style={muted}>{ask.text}</Text>
                      <View style={{ flexDirection: 'row', gap: 10, marginTop: 18 }}>
                        <Pressable onPress={() => setAsk(null)} style={{ flex: 1, padding: 13, borderRadius: 99, backgroundColor: t.bg }}><B style={{ color: t.text, textAlign: 'center', fontSize: 16 }}>Cancel</B></Pressable>
                        <Pressable onPress={() => { const f = ask.fn; setAsk(null); f(); }} style={{ flex: 1, padding: 13, borderRadius: 99, backgroundColor: '#ff3b30' }}><B style={{ color: '#fff', textAlign: 'center', fontSize: 16 }}>{ask.ok}</B></Pressable>
                      </View>
                    </View>}
                  </View>
                </Modal>

                <FullCard card={full} onClose={() => setFull(null)} onDelete={delCard} />
              </View>
              </Ctx.Provider>
            );
          }

          // full-screen code: brand-coloured header, white sheet slides up, brightness at maximum
          function FullCard({ card, onClose, onDelete }) {
            const { insets } = useT();
            const { width } = useWindowDimensions();
            const up = useRef(new Animated.Value(0)).current;
            useEffect(() => { if (card) { up.setValue(0); Animated.timing(up, { toValue: 1, duration: 480, easing: Easing.out(Easing.back(1.1)), useNativeDriver: true }).start(); } }, [card]);
            if (!card) return null;
            const b = brand(card.name), tc = b.t;
            const qr = Math.min(width - 72, 320);
            return (
              <Modal visible animationType="fade" statusBarTranslucent navigationBarTranslucent onRequestClose={onClose}>
                <View style={{ flex: 1, backgroundColor: '#fff' }}>
                  <StatusBar style={tc === '#fff' ? 'light' : 'dark'} />
                  <LinearGradient colors={[b.c, mix(b.c, '#000000', 0.58)]} start={{ x: 0.2, y: 0 }} end={{ x: 0.8, y: 1 }} style={{ paddingTop: 22 + insets.top, paddingBottom: 52, paddingHorizontal: 20, alignItems: 'center', overflow: 'hidden' }}>
                    <Text style={{ position: 'absolute', right: -10, bottom: -70, fontSize: 240, lineHeight: 240, fontWeight: '900', color: tc, opacity: 0.13 }}>{b.l}</Text>
                    <Pressable onPress={onClose} style={{ position: 'absolute', top: 14 + insets.top, right: 16, backgroundColor: 'rgba(255,255,255,0.22)', borderRadius: 99, paddingVertical: 9, paddingHorizontal: 18 }}><B style={{ color: tc, fontSize: 16 }}>Close</B></Pressable>
                    <View style={{ marginTop: 26 }}><Tile name={card.name} size={64} radius={19} font={32} translucent /></View>
                    <Text style={{ color: tc, fontSize: 26, fontWeight: '800', letterSpacing: -0.5, marginTop: 10 }}>{card.name}</Text>
