          // ---- OpenStreetMap (Overpass) ----
          // regex for Overpass: special characters become "." so no escaping is needed inside the query string
          const rx = n => n.replace(/[.*+?^${}()|[\]\\"]/g, '.').replace(/['’]/g, "['’]?").replace(/[Żż]/g, '[ŻżZz]');

          async function post(url, q) {
            const ac = new AbortController();
            const timer = setTimeout(() => ac.abort(), 60000);
            try {
              const res = await fetch(url, {
                method: 'POST', signal: ac.signal,
                headers: { 'User-Agent': UA, 'Referer': 'https://tappass.app/', 'Accept': 'application/json', 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
                body: 'data=' + encodeURIComponent(q),
              });
              if (!res.ok) throw new Error('HTTP ' + res.status);
              return await res.json();
            } finally { clearTimeout(timer); }
          }

          // Exact brand/name values inside a bounding box: the fastest kind of Overpass query
          // (regex searches over a wide circle were timing out on the busy public servers).
          const variants = n => [...new Set([n, n.replace(/’/g, "'"), n.replace(/'/g, '’'), n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'L')])];
          const qs = v => v.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
          function buildQuery(cards, lat, lng, r) {
            const values = [...new Set(cards.flatMap(c => geoNames(c.name)).flatMap(variants))];
            const dLat = r / 111320, dLng = r / (111320 * Math.cos(lat * Math.PI / 180));
            const bbox = `(${(lat - dLat).toFixed(5)},${(lng - dLng).toFixed(5)},${(lat + dLat).toFixed(5)},${(lng + dLng).toFixed(5)})`;
            const parts = values.flatMap(v => ['brand', 'name'].map(t => `nwr["${t}"="${qs(v)}"]${bbox};`));
            return `[out:json][timeout:25];(${parts.join('')});out tags center qt;`;
          }
          function parse(elements, cards) {
            const seen = new Set(), out = [];
            for (const el of elements) {
              if (!el.tags || !(el.tags.shop || el.tags.amenity)) continue;          // only real shops / cafés / fuel stations
              const la = el.lat ?? el.center?.lat, lo = el.lon ?? el.center?.lon;
              if (la == null) continue;
              const label = el.tags.brand || el.tags.name || '';
              for (const c of cardsForLabel(label, cards)) {
                const key = `${c.name}:${la.toFixed(3)}:${lo.toFixed(3)}`;   // node + building of the same store -> one entry
                if (seen.has(key)) continue;
                seen.add(key); out.push({ name: c.name, lat: la, lng: lo });
              }
            }
            return out;
          }
          async function queryStores(cards, lat, lng) {
            const good = await AsyncStorage.getItem('ovGood');                  // start with the server that worked last time
            const list = good && ENDPOINTS.includes(good) ? [good, ...ENDPOINTS.filter(u => u !== good)] : ENDPOINTS;
            let lastErr = null;
            for (const url of list) {
              const host = url.split('/')[2];
              try {
                let out = parse((await post(url, buildQuery(cards, lat, lng, SEARCH_RADIUS))).elements || [], cards);
                if (!out.length) out = parse((await post(url, buildQuery(cards, lat, lng, 20000))).elements || [], cards);
                await AsyncStorage.setItem('ovGood', url);
                await glog(`lookup ok ${host}: ${out.length} stores`);
                return out;
              } catch (e) {
                lastErr = e;
                const m = String(e.message || e);
                await glog(`lookup ${host} failed: ${/cancel|abort/i.test(m) ? 'timeout (60 s)' : m.slice(0, 70)}`);
              }
            }
            throw lastErr || new Error('lookup failed');
          }

          const offline = e => /network request failed|resolve|unknownhost|failed to connect/i.test(String(e?.message || e));

          async function onlineStores(cards, lat, lng) {
            const names = [...new Set(cards.map(c => c.name))];
            const cache = await load('osm:cache');
            const complete = cache && names.every(n => cache.names.includes(n));
            if (complete && Date.now() - cache.t < CACHE_TTL && dist(lat, lng, cache.lat, cache.lng) < CACHE_RANGE) return { stores: cache.stores };
            try {
              const stores = await queryStores(cards, lat, lng);
              await save('osm:cache', { t: Date.now(), lat, lng, names, stores });
              await AsyncStorage.removeItem('geoRetry');
              return { stores };
            } catch (e) {
