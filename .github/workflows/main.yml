              name: 'Store alerts', importance: Notifications.AndroidImportance.MAX, sound: 'default', enableVibrate: true,
              vibrationPattern: [0, 250, 120, 250], lockscreenVisibility: Notifications.AndroidNotificationVisibility.PUBLIC, bypassDnd: false,
            });
            await Notifications.deleteNotificationChannelAsync('geo-alerts').catch(() => {});   // old silent channel
          }

          // One notification for one or several cards (e.g. a mall). Tapping opens the card or a picker.
          export async function notifyNear(cardNames) {
            const cards = (await load('cards')) || [];
            const matched = [...new Set(cardNames)].map(s => cards.find(c => c.name.toLowerCase() === String(s).toLowerCase())).filter(Boolean);
            if (!matched.length) return 0;
            await ensureChannel();
            const one = matched.length === 1;
            await Notifications.scheduleNotificationAsync({
              content: {
                title: one ? `📍 You are near ${matched[0].name}!` : `📍 ${matched.length} of your stores are nearby`,
                body: one ? 'Tap to open your card.' : 'Tap to choose your card.',
                data: { cardIds: matched.map(c => c.id) },
                sound: 'default', priority: Notifications.AndroidNotificationPriority.MAX,
              },
              trigger: Platform.OS === 'android' ? { channelId: CHANNEL } : null,
            });
            await logActivity('alert', matched.map(c => c.name));
            return matched.length;
          }

          // Collect enter events that arrive within a few seconds and send them as one notification.
          async function enqueue(name) {
            const q = ((await load('queue')) || []).filter(x => Date.now() - x.t < 15000);
            q.push({ s: name, t: Date.now() });
            await save('queue', q);
            await sleep(3000);
            const now = (await load('queue')) || [];
            if (!now.length) return;                       // another handler already sent it
            await save('queue', []);
            await notifyNear(now.map(x => x.s));
          }

          // One alert per card per COOLDOWN, grouped when several stores trigger at once.
          async function alertCard(name) {
            const key = 'last:' + name;
            if (Date.now() - Number((await AsyncStorage.getItem(key)) || 0) < COOLDOWN) return;
            await AsyncStorage.setItem(key, String(Date.now()));
            await glog('ALERT ' + name);
            await enqueue(name);
          }

          const dist = (a, b, c, d) => {
            const r = x => x * Math.PI / 180, R = 6371e3;
            const h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(h));
          };

          let refreshing = false;
          async function refreshFromTask(why) {
            const cards = (await load('cards')) || [];
            if (!cards.length || (await AsyncStorage.getItem('geo')) !== '1') return;
            await refreshGeofences(cards).catch(e => glog(`${why} refresh failed ${String(e.message || e).slice(0, 80)}`));
          }

          // 1) Geofence events (system level, works with the app closed)
          TaskManager.defineTask(TASK, async ({ data, error }) => {
            if (error || !data) { await glog('geofence error ' + (error?.message || '')); return; }
            const { eventType, region } = data;
            const kind = eventType === Location.GeofencingEventType.Enter ? 'ENTER' : 'EXIT';
            await glog(`${kind} ${region.identifier.split('::')[0]}`);
            if (region.identifier === REFRESH_ID) {
              if (eventType === Location.GeofencingEventType.Exit) await refreshFromTask('zone');
              return;
            }
            if (eventType === Location.GeofencingEventType.Enter) await alertCard(region.identifier.split('::')[0]);
          });

          // 2) Android backup: location updates in a foreground service. Each position is compared with the
          //    saved stores here, so alerts work offline and do not depend on the geofencing API.
          //    It also retries a failed store lookup as soon as the phone is back online.
          TaskManager.defineTask(LOC_TASK, async ({ data, error }) => {
            if (error) { await glog('loc error ' + (error.message || error)); return; }
            if (!data?.locations?.length) return;
            const { latitude: lat, longitude: lng, accuracy } = data.locations[data.locations.length - 1].coords;
            const acc = Math.min(Math.round(accuracy || 0), 100);
            const cache = await load('geo:near');           // stores around the last refresh point
            const retry = await load('geoRetry');
            const due = retry ? Date.now() >= retry.at : !cache;
            const moved = cache && dist(lat, lng, cache.lat, cache.lng) > CACHE_RANGE;
            if (due || moved) { await refreshFromTask(due ? 'retry' : 'moved'); return; }
            if (!cache) return;
            const near = new Set();
            let best = null;
            for (const s of cache.stores) {
              const d = dist(lat, lng, s.lat, s.lng);
              if (!best || d < best.d) best = { name: s.name, d };
              if (d <= RADIUS + acc) near.add(s.name);          // GPS error counts in the user's favour
            }
            await glog(`loc ±${acc} m${best ? `, nearest ${best.name} ${Math.round(best.d)} m` : ''}`);
            for (const n of near) await alertCard(n);
          });

          export async function askPermissions() {
            await ensureChannel();
            const fg = await Location.requestForegroundPermissionsAsync();
            if (fg.status !== 'granted') return false;
            const bg = await Location.requestBackgroundPermissionsAsync();
            if (bg.status !== 'granted') return false;
            return (await Notifications.requestPermissionsAsync()).status === 'granted';
