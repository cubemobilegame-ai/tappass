              await save('geoRetry', { n: r.n + 1, at: Date.now() + BACKOFF[Math.min(r.n, BACKOFF.length - 1)] });
              const err = offline(e) ? 'No internet' : 'Store lookup failed';
              if (cache) return { stores: cache.stores.filter(s => names.includes(s.name)), stale: err };   // keep working with saved stores
              throw new Error(err + ', retrying');
            }
          }

          // ---- built-in store database ----
          const inDb = c => geoNames(c.name).some(a => STORE_DB[a]);
          function localStores(cards, lat, lng, r) {
            const out = [], seen = new Set();
            const dLat = r / 111320, dLng = r / (111320 * Math.max(0.1, Math.cos(lat * Math.PI / 180)));
            for (const c of cards) for (const a of geoNames(c.name)) {
              const pts = STORE_DB[a]; if (!pts) continue;
              for (let i = 0; i < pts.length; i += 2) {
                const la = pts[i] / 1e5, lo = pts[i + 1] / 1e5;
                if (Math.abs(la - lat) > dLat || Math.abs(lo - lng) > dLng) continue;
                const key = `${c.name}:${pts[i]}:${pts[i + 1]}`;
                if (seen.has(key)) continue;
                seen.add(key); out.push({ name: c.name, lat: la, lng: lo });
              }
            }
            return out;
          }
          export const dbInfo = () => ({ brands: Object.keys(STORE_DB).length, stores: Object.values(STORE_DB).reduce((n, v) => n + v.length / 2, 0) });

          async function getStores(cards, lat, lng) {
            const local = cards.filter(inDb), online = cards.filter(c => !inDb(c));
            let stores = localStores(local, lat, lng, LOCAL_RADIUS), stale = null;
            if (local.length) await glog(`built-in list: ${stores.length} stores of ${[...new Set(local.map(c => c.name))].join(', ')}`);
            if (!online.length) { await AsyncStorage.removeItem('geoRetry'); return { stores }; }
            try {
              const r = await onlineStores(online, lat, lng);
              stores = stores.concat(r.stores); stale = r.stale || null;
            } catch (e) {
              if (!local.length) throw e;              // nothing to fall back on
              stale = e.message;                       // built-in stores keep working
            }
            return { stores, stale };
          }

          const setStatus = s => save('geoStatus', { t: Date.now(), ...s });
          export const getStatus = () => load('geoStatus');

          const LOC_VERSION = '3';   // bump when the watcher settings change so old watchers are restarted
          async function startLoc() {
            if (Platform.OS !== 'android') return;
            if (await Location.hasStartedLocationUpdatesAsync(LOC_TASK)) {
              if ((await AsyncStorage.getItem('locVersion')) === LOC_VERSION) return;
              await Location.stopLocationUpdatesAsync(LOC_TASK);
            }
            await AsyncStorage.setItem('locVersion', LOC_VERSION);
            await Location.startLocationUpdatesAsync(LOC_TASK, {
              // real GPS every ~10 s / 25 m: "balanced" (Wi-Fi/cell) mode gave almost no updates with the screen off
              accuracy: Location.Accuracy.High, distanceInterval: 25, timeInterval: 10000, deferredUpdatesInterval: 0,
              pausesUpdatesAutomatically: false,
              foregroundService: { notificationTitle: 'TapPass', notificationBody: 'Watching for your stores nearby', notificationColor: '#6f7285' },   // quiet grey, not brand purple
            });
          }
          async function stopLoc() {
            if (await Location.hasStartedLocationUpdatesAsync(LOC_TASK)) await Location.stopLocationUpdatesAsync(LOC_TASK);
          }

          // GPS indoors can be slow: wait up to 15 s, then fall back to the last known position.
          async function position() {
            try {
              const p = await Promise.race([Location.getCurrentPositionAsync({ accuracy: Location.Accuracy.Balanced }), sleep(15000).then(() => null)]);
              if (p) return p.coords;
            } catch (e) {}
            const last = await Location.getLastKnownPositionAsync({ maxAge: 30 * 60e3 }).catch(() => null);
            if (last) return last.coords;
            throw new Error('Waiting for location');
          }

          // Registers the nearest stores of the user's cards plus one big "refresh zone".
          // If the user is ALREADY inside a store radius, notify right away (Android only fires on a fresh "enter").
          export async function refreshGeofences(cards, reliableOpt) {
            if (refreshing) return -1;
            refreshing = true;
            try {
              const reliable = reliableOpt ?? ((await AsyncStorage.getItem('reliable')) !== '0');
              // start the background watcher first: it keeps retrying even if this lookup fails
              if (reliable) await startLoc().catch(e => glog('fg service failed ' + e.message)); else await stopLoc();
              const { latitude: lat, longitude: lng } = await position();
              const { stores: all, stale } = await getStores(cards, lat, lng);
              const sorted = all.map(s => ({ ...s, d: dist(lat, lng, s.lat, s.lng) })).sort((a, b) => a.d - b.d);
              await save('geo:near', { t: Date.now(), lat, lng, stores: sorted.filter(s => s.d <= CACHE_RANGE + 2000).map(({ name, lat: la, lng: lo }) => ({ name, lat: la, lng: lo })) });
              const stores = sorted.slice(0, MAX_REGIONS);
              const regions = stores.map(p => ({ identifier: `${p.name}::${p.lat.toFixed(4)},${p.lng.toFixed(4)}`, latitude: p.lat, longitude: p.lng, radius: RADIUS, notifyOnEnter: true, notifyOnExit: false }));
              regions.push({ identifier: REFRESH_ID, latitude: lat, longitude: lng, radius: REFRESH_RADIUS, notifyOnEnter: false, notifyOnExit: true });
              await Location.startGeofencingAsync(TASK, regions);
              const fresh = [];
              for (const n of new Set(stores.filter(s => s.d <= RADIUS).map(s => s.name))) {
                const key = 'last:' + n;
                if (Date.now() - Number((await AsyncStorage.getItem(key)) || 0) >= COOLDOWN) { await AsyncStorage.setItem(key, String(Date.now())); fresh.push(n); }
              }
              if (fresh.length) await notifyNear(fresh);
              await glog(`registered ${stores.length} stores${stores[0] ? ', nearest ' + stores[0].name + ' ' + Math.round(stores[0].d) + ' m' : ''}${reliable ? ' +fg' : ''}${stale ? ' (saved list: ' + stale + ')' : ''}`);
              await setStatus({ count: stores.length, near: stores.filter(s => s.d <= 1000).length, stale: stale || null, nearest: stores[0] ? { name: stores[0].name, d: Math.round(stores[0].d) } : null });
              return stores.length;
            } catch (e) {
              await glog('refresh error ' + String(e.message || e).slice(0, 100));
              await setStatus({ err: String(e.message || e).slice(0, 120) });
              throw e;
            } finally { refreshing = false; }
          }

          export async function stopGeo() {
            if (await Location.hasStartedGeofencingAsync(TASK)) await Location.stopGeofencingAsync(TASK);
            await stopLoc();
            await AsyncStorage.multiRemove(['geoRetry', 'geo:near']);
          }
