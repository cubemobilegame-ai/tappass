              <Group>
                <Row ico="🧹" bg="#ff9500" title="Clear Activity History" sub={log.length + ' events'} onPress={() => confirm('Clear activity history?', 'All activity entries will be removed.', 'Clear', () => setLog([]))} />
                <Row ico="🗑" bg="#ff3b30" title="Delete All Cards" sub={cards.length + ' saved on this device'} onPress={() => cards.length && confirm('Delete all cards?', 'All cards will be removed from this device.', 'Delete all', () => setCards([]))} last />
              </Group>
              {DEV_TOOLS && <>
                <Sec>Developer</Sec>
                <Group><Row ico="🛠" bg="#636366" title="Developer mode" sub="Test tools. Remove in the production build." onPress={() => setDev(!dev)} right={<Sw on={dev} />} last /></Group>
                {dev && <Group>
                  <Row title="Dev Mode: Toggle Pro Status" sub={pro ? 'Pro is ON' : 'Pro is OFF'} onPress={toggleDevPro} right={<Sw on={pro} />} />
                  {geoOn && <Row title="Geo-alerts status" sub={gstat?.stale ? `${gstat.count} saved stores · ${gstat.stale}` : gstat?.nearest ? `Watching ${gstat.count} stores · nearest: ${gstat.nearest.name}, ${gstat.nearest.d} m` : geoStatus} onPress={refreshNow} right={<Text style={{ color: t.accent, fontSize: 13, fontWeight: '700' }}>Refresh</Text>} />}
                  <Text style={{ paddingTop: 12, paddingHorizontal: 14, paddingBottom: 4, color: t.sub, fontSize: 13 }}>Geofencing simulator (needs Pro and Geo-alerts ON)</Text>
                  <Sim onPress={() => cards.length ? notifyNear([cards[0].name]) : say('Add a card first')}>🔔 Send test notification</Sim>
                  <Sim onPress={showLog}>📜 Show geo log</Sim>
                  {SIM.map(n => <Sim key={n} onPress={() => simulate(n)}>📍 Simulate: Walking into {n}</Sim>)}
                  <Sim onPress={simulateMall} last>🏬 Simulate: Mall with several of my stores</Sim>
                </Group>}
              </>}
              <Text style={{ fontSize: 12, color: t.sub, textAlign: 'center', marginTop: 6 }}>Store locations © OpenStreetMap contributors</Text>
              <Text style={{ fontSize: 13, color: t.sub, textAlign: 'center', marginTop: 6 }}>TapPass 1.0.0</Text>
            </>;

            // ---------- bottom sheets ----------
            const devPro = DEV_TOOLS && dev && <View style={{ marginTop: 12 }}><Group><Row title="Dev Mode: Toggle Pro Status" sub={pro ? 'Pro is ON' : 'Pro is OFF'} onPress={toggleDevPro} right={<Sw on={pro} />} last /></Group></View>;

            const paywall = () => <Sheet onClose={() => setSheet(null)}>
              <Hero top={<View style={{ boxShadow: '0px 10px 20px rgba(0,0,0,0.31)', borderRadius: 17 }}><Logo size={76} /></View>} title="Try 14 Days Free" text="Never search for your loyalty card at the checkout again." />
              <View style={{ marginVertical: 18, marginHorizontal: 4 }}>
                {[['Unlimited cards'], ['GPS Geo-alerts at your favorite stores', true], ['Cancel anytime']].map(([l, q]) => (
                  <View key={l} style={{ flexDirection: 'row', gap: 12, alignItems: 'center', paddingVertical: 7 }}><Check /><Text style={{ color: t.text, fontWeight: '600', fontSize: 16, flexShrink: 1 }}>{l}</Text>{q && <QM />}</View>))}
              </View>
              {[['monthly', 'Monthly - $2.99 / month'], ['yearly', 'Yearly (Save 45%) - $19.99 / year']].map(([k, l]) => (
                <Pressable key={k} onPress={() => setPlan(k)} style={{ backgroundColor: t.card, borderWidth: 2, borderColor: plan === k ? t.accent : t.line, borderRadius: 22, paddingVertical: 15, paddingHorizontal: 16, marginVertical: 10 }}>
                  {k === 'yearly' && <View style={{ position: 'absolute', right: 14, top: -11, backgroundColor: '#ff9f0a', paddingVertical: 4, paddingHorizontal: 10, borderRadius: 99 }}><Text style={{ color: '#fff', fontSize: 12, fontWeight: '800' }}>Save 45%</Text></View>}
                  <B style={{ color: t.text, fontSize: 16 }}>{l}</B><Text style={{ color: t.sub, fontSize: 14, marginTop: 2 }}>(after 14-day free trial)</Text>
                </Pressable>))}
              {/* TODO: replace with RevenueCat: Purchases.purchasePackage(...) and Purchases.restorePurchases() */}
              <Cta style={{ marginTop: 6 }} onPress={() => { setPro(true); setSheet(null); }}>Start 14-Day Free Trial</Cta>
              <Text style={{ fontSize: 13, color: t.sub, textAlign: 'center', marginTop: 12 }}>Prototype only. No real payment is made.</Text>
              <View style={{ flexDirection: 'row', justifyContent: 'center', gap: 18, marginTop: 8 }}>
                {[['Restore Purchases', restore], ['Terms', () => say('Opens terms of use')], ['Privacy', () => setSheet('pol')]].map(([l, f]) => <Text key={l} onPress={f} style={{ color: t.accent, fontSize: 13, fontWeight: '600' }}>{l}</Text>)}
              </View>
              {devPro}
            </Sheet>;

            const geoInfo = () => <Sheet onClose={() => setSheet(null)}>
              <Hero top={<Text style={{ fontSize: 40 }}>📍</Text>} title="GPS Geo-alerts" text="Your card appears the moment you arrive at a store." />
              <H3>The idea</H3>
              <P>You are at the checkout, the queue is moving, and you are still scrolling for the right loyalty card. Geo-alerts removes that moment. When you walk up to a store whose card you saved, TapPass sends you a notification. One tap opens the code full screen, ready to scan.</P>
              <View style={[card, { flexDirection: 'row', gap: 12, alignItems: 'center', borderRadius: 20, paddingVertical: 12, paddingHorizontal: 14, marginVertical: 10 }]}>
                <Tile name="Tesco" />
                <View style={{ flex: 1 }}><Text style={{ color: t.sub, fontSize: 12 }}>TAPPASS · now</Text><Text style={{ color: t.text, fontSize: 14 }}>📍 You are near Tesco! Tap to open your card.</Text></View>
              </View>
              <H3>How it works</H3>
              {[['Add your cards', 'Geo-alerts only watches stores whose card you saved.'], ['Turn it on', 'Allow location (“Always”) and notifications when your phone asks.'],
                ['We find stores near you', 'TapPass looks up the nearest locations of your chains and keeps watching the closest ones. The list refreshes as you move around.'],
                ['You arrive', 'Within about 150 metres of the store you get the alert, even when your phone is locked and the app is closed.'], ['Tap and scan', 'The code opens full screen at maximum brightness.']].map(([b, x], i) => (
                <View key={b} style={{ flexDirection: 'row', gap: 12, alignItems: 'flex-start', paddingVertical: 8 }}>
                  <View style={{ width: 26, height: 26, borderRadius: 13, backgroundColor: t.accent, alignItems: 'center', justifyContent: 'center' }}><Text style={{ color: t.on, fontSize: 13, fontWeight: '800' }}>{i + 1}</Text></View>
                  <View style={{ flex: 1 }}><B style={{ color: t.text, fontSize: 15 }}>{b}</B><Text style={{ color: t.text, fontSize: 14, lineHeight: 21 }}>{x}</Text></View>
                </View>))}
              <H3>Good to know</H3>
              <Li>You get one alert per store every 4 hours, so there is no spam.</Li>
              <Li>If you enter a mall with several of your stores, you get a single notification and choose the card.</Li>
              <Li>Alerts can take a minute or two to arrive. This is normal for phone location services.</Li>
              <Li>Stores are saved on your phone, so alerts still work in a store with no signal.</Li>
              <Li>On Android, a small “watching for nearby stores” notification can stay visible. It keeps the system from stopping alerts and can be switched off in Settings.</Li>
              <Li>For best results set battery usage for TapPass to “Unrestricted”.</Li>
              <H3>Your privacy</H3>
              <P>Your location is used to detect nearby stores. To find them, the app sends your approximate position and the names of your chains to a map service (OpenStreetMap). TapPass never sees what you buy or spend. You can turn Geo-alerts off at any time and alerts stop immediately. <Text onPress={() => setSheet('pol')} style={{ color: t.accent, fontSize: 13, fontWeight: '600' }}>Read the Privacy Policy</Text></P>
              <H3>Availability</H3>
              <P>Geo-alerts is a Pro feature. Try it free for 14 days.</P>
              {!pro ? <Cta style={{ marginTop: 12 }} onPress={() => setSheet('pay')}>Try 14 Days Free</Cta> : !geoOn ? <Cta style={{ marginTop: 12 }} onPress={() => { setSheet(null); toggleGeo(); }}>Turn on Geo-alerts</Cta> : null}
              <Pressable onPress={() => setSheet(null)} style={{ width: '100%', padding: 14 }}><Text style={{ color: t.sub, fontWeight: '700', textAlign: 'center', fontSize: 16 }}>Got it</Text></Pressable>
            </Sheet>;

            const rich = (s, k) => s.split(/(<b>[\s\S]*?<\/b>|<span class="ph">[\s\S]*?<\/span>)/).filter(Boolean).map((x, i) =>
              x.startsWith('<b>') ? <B key={k + i}>{x.slice(3, -4)}</B>
                : x.startsWith('<span') ? <Text key={k + i} style={{ backgroundColor: '#ffe08a', color: '#000' }}> {x.replace(/<[^>]+>/g, '')} </Text>
                : x.replace(/<[^>]+>/g, ''));
            const policy = () => <Sheet onClose={() => setSheet(null)}>
              <H2 style={{ marginBottom: 4 }}>Privacy Policy</H2>
              {[...POLICY.matchAll(/<(h3|p|li)([^>]*)>([\s\S]*?)<\/\1>/g)].map((m, i) => m[1] === 'h3' ? <H3 key={i}>{rich(m[3], i)}</H3>
                : m[1] === 'li' ? <Li key={i}>{rich(m[3], i)}</Li>
                : <P key={i} style={m[2].includes('muted') ? { color: t.sub } : null}>{rich(m[3], i)}</P>)}
            </Sheet>;

            const chooser = cs => <Sheet onClose={() => setSheet(null)}>
              <H2>Stores nearby</H2>
              <Text style={[muted, { marginTop: -6, marginBottom: 16 }]}>Pick the card to show at checkout.</Text>
              {cs.filter(c => cards.some(x => x.id === c.id)).map((c, i, a) => <WalletCard key={c.id} c={c} last={i === a.length - 1} />)}
            </Sheet>;

            const openBattery = async () => {
              try { await Linking.sendIntent('android.settings.IGNORE_BATTERY_OPTIMIZATION_SETTINGS'); } catch (e) { Linking.openSettings(); }
            };
            const healthSheet = () => {
              const h = health || {};
              const items = [
                ['bg', '📍', 'Location: “Allow all the time”', 'Needed so TapPass can notice a store while the app is closed.', 'Open settings', () => Linking.openSettings()],
                ['precise', '🎯', 'Precise location', 'Approximate location can be off by 1–3 km, which is too far to spot a store.', 'Open settings', () => Linking.openSettings()],
                ['notif', '🔔', 'Notifications allowed', 'Without them the alert cannot appear.', 'Open settings', () => Linking.openSettings()],
                ...(Platform.OS === 'android' ? [['battery', '🔋', 'Battery: “Unrestricted”', 'Many phones put apps to sleep to save battery, and then alerts stop. Find TapPass on the list and choose “Don’t optimise” / “Unrestricted”.', 'Fix battery setting', openBattery]] : []),
              ];
              return <Sheet onClose={() => setSheet(null)}>
                <H2>Make alerts reliable</H2>
                <Text style={[muted, { marginTop: -6, marginBottom: 14 }]}>Geo-alerts work in the background, so your phone has to allow it. Fix anything marked below, then come back to TapPass.</Text>
                {items.map(([k, ico, title, text, btn, fn]) => { const ok = !!h[k]; return (
                  <View key={k} style={[card, { borderRadius: 20, padding: 14, marginBottom: 10 }]}>
                    <View style={{ flexDirection: 'row', alignItems: 'center', gap: 12 }}>
                      <Text style={{ fontSize: 22 }}>{ico}</Text>
                      <B style={{ flex: 1, color: t.text, fontSize: 15 }}>{title}</B>
                      <View style={{ width: 26, height: 26, borderRadius: 13, backgroundColor: ok ? t.green : '#ff3b30', alignItems: 'center', justifyContent: 'center' }}><Text style={{ color: '#fff', fontSize: 13, fontWeight: '800' }}>{ok ? '✓' : '!'}</Text></View>
                    </View>
                    {!ok && <>
                      <Text style={{ color: t.sub, fontSize: 13, lineHeight: 18, marginTop: 8 }}>{text}</Text>
                      <Pressable onPress={fn} style={{ marginTop: 10, alignSelf: 'flex-start', backgroundColor: t.accent, borderRadius: 99, paddingVertical: 9, paddingHorizontal: 16 }}><B style={{ color: t.on, fontSize: 14 }}>{btn}</B></Pressable>
                    </>}
                  </View>); })}
                {healthIssues.length === 0 && <Text style={{ color: t.green, fontWeight: '700', textAlign: 'center', marginVertical: 8, fontSize: 15 }}>All set. Alerts will reach you even with the app closed.</Text>}
                <Pressable onPress={() => { checkHealth(); }} style={{ width: '100%', padding: 14 }}><Text style={{ color: t.accent, fontWeight: '700', textAlign: 'center', fontSize: 15 }}>Check again</Text></Pressable>
              </Sheet>;
            };

            const tabs = [['w', 'Wallet'], ['a', 'Activity'], ['l', 'List'], ['s', 'Settings']];
            return (
              <Ctx.Provider value={{ t, insets, showInfo: () => setSheet('info'), openFull }}>
              <View style={{ flex: 1, backgroundColor: t.bg }}>
                <StatusBar style={t.dark ? 'light' : 'dark'} />
                <ScrollView ref={scroll} keyboardShouldPersistTaps="handled" contentContainerStyle={{ width: '100%', maxWidth: 480, alignSelf: 'center', paddingTop: 16 + insets.top, paddingHorizontal: 12, paddingBottom: 130 + insets.bottom }}>
                  {tab === 'w' ? viewWallet() : tab === 'a' ? viewActivity() : tab === 'l' ? viewList() : viewSettings()}
                </ScrollView>

                {toast ? <View pointerEvents="none" style={{ position: 'absolute', left: 0, right: 0, bottom: 104 + insets.bottom, alignItems: 'center' }}>
                  <Text style={{ backgroundColor: 'rgba(30,30,32,0.94)', color: '#fff', paddingHorizontal: 18, paddingVertical: 10, borderRadius: 99, overflow: 'hidden', fontSize: 14 }}>{toast}</Text></View> : null}

                <View style={{ position: 'absolute', left: 0, right: 0, bottom: 14 + insets.bottom, alignItems: 'center' }}>
                  <View style={{ width: '100%', maxWidth: 480, paddingHorizontal: 12 }}>
                    <View style={{ flexDirection: 'row', gap: 2, backgroundColor: t.card, borderRadius: 30, padding: 6, boxShadow: '0px 12px 32px rgba(30,30,70,0.2)' }}>
                      {tabs.map(([k, l]) => { const on = tab === k; return (
                        <Pressable key={k} onPress={() => goTab(k)} accessibilityLabel={l} style={{ flex: on ? 1.7 : 1, flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: 6, height: 46, minWidth: 44, borderRadius: 22, paddingHorizontal: 10, backgroundColor: on ? t.text : 'transparent' }}>
                          {TAB_ICON[k](on ? t.bg : t.sub)}
                          {on && <Text style={{ color: t.bg, fontSize: 13, fontWeight: '700' }} numberOfLines={1}>{l}</Text>}
                        </Pressable>); })}
                    </View>
                  </View>
                </View>

                {sheet === 'add' && <AddCard onClose={() => setSheet(null)} onSave={saveCard} say={say} />}
                {sheet === 'pay' && paywall()}
                {sheet === 'info' && geoInfo()}
                {sheet === 'pol' && policy()}
                {sheet === 'health' && healthSheet()}
                {sheet && sheet.choose && chooser(sheet.choose)}

                <Modal visible={!!ask} transparent animationType="fade" statusBarTranslucent onRequestClose={() => setAsk(null)}>
                  <View style={{ flex: 1, backgroundColor: 'rgba(0,0,0,0.44)', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
                    {ask && <View style={[card, { borderRadius: 28, padding: 22, width: '100%', maxWidth: 340 }]}>
                      <Text style={{ color: t.text, fontSize: 20, fontWeight: '800', marginBottom: 6 }}>{ask.title}</Text>
                      <Text style={muted}>{ask.text}</Text>
                      <View style={{ flexDirection: 'row', gap: 10, marginTop: 18 }}>
                        <Pressable onPress={() => setAsk(null)} style={{ flex: 1, padding: 13, borderRadius: 99, backgroundColor: t.bg }}><B style={{ color: t.text, textAlign: 'center', fontSize: 16 }}>Cancel</B></Pressable>
                        <Pressable onPress={() => { const f = ask.fn; setAsk(null); f(); }} style={{ flex: 1, padding: 13, borderRadius: 99, backgroundColor: '#ff3b30' }}><B style={{ color: '#fff', textAlign: 'center', fontSize: 16 }}>{ask.ok}</B></Pressable>
                      </View>
                    </View>}
                  </View>
                </Modal>

                <Modal visible={!!full} animationType="fade" statusBarTranslucent navigationBarTranslucent onRequestClose={() => setFull(null)}>
                  {full && <View style={{ flex: 1, backgroundColor: '#fff', alignItems: 'center', justifyContent: 'center', paddingTop: 20 + insets.top, paddingBottom: 20 + insets.bottom, paddingHorizontal: 16 }}>
                    <StatusBar style="dark" />
                    <Pressable onPress={() => setFull(null)} style={{ position: 'absolute', top: 14 + insets.top, right: 16, backgroundColor: '#eee', borderRadius: 99, paddingVertical: 9, paddingHorizontal: 18 }}><B style={{ color: '#000', fontSize: 16 }}>Close</B></Pressable>
                    <Tile name={full.name} />
                    <Text style={{ color: '#000', fontSize: 24, fontWeight: '800', marginTop: 14, marginBottom: 6 }}>{full.name}</Text>
                    <View style={{ width: '100%', maxWidth: 560, alignItems: 'center' }}><Code card={full} big width={300} /></View>
                    <Text style={{ color: '#555', fontSize: 14, marginTop: 10, textAlign: 'center' }}>{full.type === 'qr' ? '' : fmtNum(full.num) + ' · '}Hold your screen up to the scanner</Text>
                    <Text onPress={() => delCard(full)} style={{ color: '#555', fontSize: 14, marginTop: 10, textDecorationLine: 'underline' }}>Delete card</Text>
                  </View>}
                </Modal>
              </View>
              </Ctx.Provider>
            );
          }

          // "zab" / "Żab" -> "Żabka": so the card name matches the store name used for geofencing
          const resolveName = n => {
            const q = fold(n.trim());
            const hit = STORES.find(s => fold(s.n) === q);
            if (hit) return hit.n;
            const p = q ? STORES.filter(s => fold(s.n).startsWith(q)) : [];
            return p.length === 1 ? p[0].n : n.trim();
          };

          function AddCard({ onClose, onSave, say }) {
            const { t } = useT();
            const card = cardStyle(t);
            const [name, setName] = useState('');
            const [num, setNum] = useState('');
            const [type, setType] = useState('barcode');
            const [fmt, setFmt] = useState(null);
            const [scanning, setScanning] = useState(false);
            const [perm, askCam] = useCameraPermissions();
            const numRef = useRef(null);
            const close = onClose;

            const q = fold(name.trim());
            const rank = n => { n = fold(n); return !q || n.startsWith(q) ? 0 : n.split(/[\s'’-]+/).some(w => w.startsWith(q)) ? 1 : n.includes(q) ? 2 : 9; };
            const list = STORES.map((s, i) => ({ s, i, r: rank(s.n) })).filter(x => x.r < 9).sort((a, b) => a.r - b.r || a.i - b.i).map(x => x.s);
            const best = q && list.length && fold(list[0].n) !== q ? list[0].n : null;

            const apply = r => {
              if (!r) return say('No code found. Try a sharper, closer photo.');
              const qr = r.type === 'qr' || r.type === 256; setNum(cleanCode(r.data)); setType(qr ? 'qr' : 'barcode'); setFmt(qr ? null : FMT[r.type] || null);
              say('Code detected ✓');
            };
            const openScanner = async () => { if (!perm?.granted && !(await askCam()).granted) return; setScanning(true); };
            const importImage = async () => {
              const res = await ImagePicker.launchImageLibraryAsync({ mediaTypes: ['images'] });
              if (res.canceled) return;
              say('Reading code…');
              try { apply((await CameraView.scanFromURLAsync(res.assets[0].uri, SCAN_TYPES))[0]); } catch (e) { apply(null); }
            };
            const ok = name.trim() && num.length >= 4;
            const inp = { width: '100%', fontSize: 16, paddingVertical: 14, paddingHorizontal: 16, borderRadius: 16, borderWidth: 1.5, borderColor: t.line, backgroundColor: t.card, color: t.text, marginTop: 6, marginBottom: 12 };
            const lbl = { fontSize: 13, color: t.sub };

            if (scanning) return (
              <Modal visible animationType="slide" statusBarTranslucent onRequestClose={() => setScanning(false)}>
                <View style={{ flex: 1, backgroundColor: '#000' }}>
                  <CameraView style={{ flex: 1 }} barcodeScannerSettings={{ barcodeTypes: SCAN_TYPES }} onBarcodeScanned={r => { setScanning(false); apply(r); }} />
                  <Text onPress={() => setScanning(false)} style={{ position: 'absolute', top: 60, right: 20, color: '#fff', fontSize: 17, fontWeight: '700' }}>Cancel</Text>
                  <Text style={{ position: 'absolute', bottom: 60, width: '100%', textAlign: 'center', color: '#fff', fontSize: 15 }}>Point the camera at the card’s code</Text>
                </View>
              </Modal>
            );
            return (
              <Sheet onClose={close}>
                <H2>Add Card</H2>
                <View style={{ flexDirection: 'row', gap: 10, marginBottom: 14 }}>
                  {[['📷', 'Scan with camera', openScanner], ['🖼', 'Import code image', importImage]].map(([i, l, f]) => (
                    <Pressable key={l} onPress={f} style={[card, { flex: 1, borderRadius: 20, paddingVertical: 12, paddingHorizontal: 6, alignItems: 'center', gap: 4 }]}>
                      <Text style={{ fontSize: 24 }}>{i}</Text><Text style={{ color: t.accent, fontWeight: '700', fontSize: 12 }}>{l}</Text></Pressable>))}
                </View>
                <Text style={lbl}>Store</Text>
                <TextInput style={inp} value={name} onChangeText={setName} placeholder="Start typing, e.g. “Sta”" placeholderTextColor={t.sub} autoCorrect={false}
                  returnKeyType="next" onSubmitEditing={() => { if (best) setName(best); else numRef.current?.focus(); }} />
                <ScrollView horizontal showsHorizontalScrollIndicator={false} keyboardShouldPersistTaps="handled" style={{ marginHorizontal: -18, marginBottom: 12 }} contentContainerStyle={{ paddingHorizontal: 18, paddingTop: 2, paddingBottom: 6, gap: 8 }}>
                  {list.length ? list.map(s => { const sel = fold(s.n) === q, sug = s.n === best; return (
                    <Pressable key={s.n} onPress={() => { setName(s.n); numRef.current?.focus(); }} style={{ flexDirection: 'row', alignItems: 'center', gap: 8, paddingVertical: 6, paddingLeft: 6, paddingRight: 14, backgroundColor: sug ? mix(t.accent, t.card, 0.14) : t.card, borderWidth: 2, borderColor: sel || sug ? t.accent : 'transparent', borderRadius: 16 }}>
                      <Tile name={s.n} size={28} radius={9} font={15} /><Text style={{ color: t.text, fontSize: 14, fontWeight: '600' }}>{s.n}</Text>
                    </Pressable>); })
                    : <Text style={{ color: t.sub, fontSize: 14, paddingVertical: 6 }}>No match. We’ll save it as “{name}”.</Text>}
                </ScrollView>
                <Text style={lbl}>Card number</Text>
                <TextInput ref={numRef} style={inp} value={num} onChangeText={v => { setNum(cleanCode(v)); setFmt(null); }} autoCapitalize="none" autoCorrect={false} placeholder="Card number (or scan above)" placeholderTextColor={t.sub} />
                <View style={{ flexDirection: 'row', backgroundColor: t.line, borderRadius: 14, padding: 3, marginTop: 6, marginBottom: 12 }}>
                  {[['barcode', 'Barcode'], ['qr', 'QR Code']].map(([k, l]) => (
                    <Pressable key={k} onPress={() => setType(k)} style={{ flex: 1, padding: 9, borderRadius: 11, backgroundColor: type === k ? t.card : 'transparent', boxShadow: type === k ? '0px 1px 4px rgba(0,0,0,0.2)' : undefined }}>
                      <Text style={{ textAlign: 'center', color: t.text, fontSize: 14, fontWeight: type === k ? '700' : '500' }}>{l}</Text></Pressable>))}
                </View>
                <View style={{ backgroundColor: '#fff', borderRadius: 20, padding: 12, minHeight: 90, alignItems: 'center', justifyContent: 'center', marginBottom: 14 }}>
                  {num ? <Code card={{ num, type, fmt }} /> : <Text style={{ color: '#888', fontSize: 14 }}>Code preview appears here</Text>}
                </View>
                <Cta disabled={!ok} onPress={() => onSave({ name: resolveName(name), num, type, fmt })}>Save Card</Cta>
              </Sheet>
            );
          }

          const POLICY = `<p class="muted">Last updated: 22 October 2026</p>
          <p><b>In short.</b> TapPass keeps your loyalty cards and shopping list on your device. If you switch on Geo-alerts, we use your location to tell you when you are near a store. With your permission we also use data for marketing, and we may share or sell anonymous, aggregated statistics with third parties. We never sell information that identifies you, such as your name, e-mail address or card numbers. By using TapPass you acknowledge this policy. You can object or opt out at any time by e-mailing us (see section 13).</p>
          <h3>1. Who we are</h3>
          <p>The controller of your personal data is <b>Jordan Żak</b>, a sole trader trading as <b>bezdluzni.pl</b> (“we”, “us”), Poland. Polish tax ID (NIP): <b>5272505739</b>. Registered address: <span class="ph">[address to be completed]</span>. Contact: <span class="ph">[contact e-mail to be completed]</span>.</p>
          <h3>2. Data we process</h3>
          <li><b>Card and list data:</b> store names, card numbers, barcode or QR content that you type or scan, and shopping list items. In the current version this stays on your device.</li>
