      - name: App icon and splash (design C, files in brand/)
        run: |
          mkdir -p assets
          cp brand/icon.png brand/adaptive-icon.png brand/splash-icon.png assets/

      - name: Restore store database cache
        uses: actions/cache/restore@v4
        with:
          path: storedb-cache.json
          key: storedb-${{ github.run_id }}
          restore-keys: storedb-

      - name: Build store database (All the Places, official store locators)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          cp stores.js /tmp/stores.mjs
          node --input-type=module -e "import('/tmp/stores.mjs').then(m=>{const a=new Set(m.STORES.map(s=>s.n));Object.values(m.GEO_ALIAS).flat().forEach(x=>a.add(x));console.log(JSON.stringify([...a]))})" > /tmp/aliases.json
          URL=$(python3 build_storedb.py /tmp/aliases.json /tmp/unused.json)
          echo "Downloading $URL"
          df -h / /tmp | tail -2
          curl -fL --retry 3 -sS -A "TapPass-build/1.0 (support@tappass.app)" -o /tmp/atp.zip "$URL"
          python3 build_storedb.py /tmp/aliases.json /tmp/storedb.json /tmp/atp.zip | tee /tmp/db.log
          echo "::notice title=Store database::$(grep -E '^(total|spider)' /tmp/db.log | tr '\n' ' ')"
          echo "::notice title=Store counts::$(grep -vE '^(total|spider)' /tmp/db.log | tr '\n' ';' | cut -c1-3000)"
          rm -f /tmp/atp.zip
          cp /tmp/storedb.json storedb-cache.json

      - name: Use store database
        run: |
          mkdir -p assets
          if [ -s storedb-cache.json ]; then cp storedb-cache.json assets/storedb.json; else echo '{}' > assets/storedb.json; echo "::warning title=Store database::empty - app will use online lookup only"; fi
          ls -la assets/storedb.json

      - name: Save store database cache
        if: hashFiles('storedb-cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: storedb-cache.json
          key: storedb-${{ github.run_id }}

      - name: Install dependencies
        run: |
          npm install
          npx expo install expo-location expo-task-manager expo-notifications expo-camera expo-image-picker expo-brightness expo-battery expo-image-manipulator expo-iap @react-native-async-storage/async-storage react-native-svg react-native-safe-area-context expo-linear-gradient expo-font expo-status-bar
          npm install react-native-qrcode-svg jsbarcode @expo-google-fonts/plus-jakarta-sans @zxing/library jpeg-js

      - name: Self-test photo barcode reader
        run: |
          cp imgscan.js imgscan.test.mjs
          node decode-test.mjs
          rm -f imgscan.test.mjs decode-test.mjs

      - name: Create .env (EXPO_PUBLIC_* trafia do aplikacji = publiczne)
        run: |
          echo "EXPO_PUBLIC_DEV_TOOLS=${{ vars.EXPO_PUBLIC_DEV_TOOLS || '1' }}" >> .env
          echo "EXPO_PUBLIC_OVERPASS_URL=${{ secrets.EXPO_PUBLIC_OVERPASS_URL }}" >> .env

      - name: Version code = build number (Google Play needs a higher number for every upload)
        run: node -e "const f='app.json',j=require('./'+f);j.expo.android.versionCode=${{ github.run_number }};j.expo.version='1.0.0';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Decode keystore (only if secret exists)
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            # APK for your phone + AAB for Google Play, both signed with the upload key
            ./gradlew assembleRelease bundleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/*.apk tappass.apk
          if ls android/app/build/outputs/bundle/release/*.aab >/dev/null 2>&1; then cp android/app/build/outputs/bundle/release/*.aab tappass.aab; fi

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TapPass build ${{ github.run_number }}
          prerelease: true
          files: |
            tappass.apk
            tappass.aab
