          };

          const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
          export function b64ToBytes(b64) {
            const s = b64.replace(/[^A-Za-z0-9+/]/g, ''), n = Math.floor(s.length * 3 / 4), out = new Uint8Array(n);
            let o = 0;
            for (let i = 0; i < s.length; i += 4) {
              const a = ABC.indexOf(s[i]), b = ABC.indexOf(s[i + 1]), c = ABC.indexOf(s[i + 2]), d = ABC.indexOf(s[i + 3]);
              const v = (a << 18) | (b << 12) | ((c < 0 ? 0 : c) << 6) | (d < 0 ? 0 : d);
              if (o < n) out[o++] = (v >> 16) & 255;
              if (o < n && c >= 0) out[o++] = (v >> 8) & 255;
              if (o < n && d >= 0) out[o++] = v & 255;
            }
            return out.subarray(0, o);
          }

          function luminance(data, w, h) {
            const out = new Uint8ClampedArray(w * h);
            for (let i = 0, j = 0; i < out.length; i++, j += 4) out[i] = (data[j] * 306 + data[j + 1] * 601 + data[j + 2] * 117) >> 10;
            return out;
          }
          function rotate90(l, w, h) {          // returns an h x w image
            const o = new Uint8ClampedArray(w * h);
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) o[x * h + (h - 1 - y)] = l[y * w + x];
            return o;
          }

          // returns { data, type } like the camera scanner, or null
          export function decodeJpegBase64(b64) {
            const img = jpeg.decode(b64ToBytes(b64), { useTArray: true, formatAsRGBA: true, maxMemoryUsageInMB: 256 });
            const reader = new MultiFormatReader();
            const hints = new Map();
            hints.set(DecodeHintType.TRY_HARDER, true);
            hints.set(DecodeHintType.POSSIBLE_FORMATS, Object.keys(FORMATS).map(Number));
            reader.setHints(hints);
            let l = luminance(img.data, img.width, img.height), w = img.width, h = img.height;
            for (let r = 0; r < 2; r++) {        // as taken, then turned 90 degrees (photos of cards are often sideways)
              try {
                const res = reader.decodeWithState(new BinaryBitmap(new HybridBinarizer(new RGBLuminanceSource(l, w, h))));
                return { data: res.getText(), type: FORMATS[res.getBarcodeFormat()] || 'code128' };
              } catch (e) {}
              l = rotate90(l, w, h); [w, h] = [h, w];
            }
            return null;
          }
          TAPPASS_EOF
          cat > decode-test.mjs <<'TAPPASS_EOF'
          // CI self-test: draws an EAN-13 card photo (with noise, upright and sideways), saves it as JPEG
          // and checks that the photo reader in imgscan.js gets the number back.
          import * as JP from 'jpeg-js';
          import { decodeJpegBase64 } from './imgscan.test.mjs';
          const jpeg = JP.encode ? JP : JP.default;

          const L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
          const G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
          const R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
          const P = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
          function ean(code) {
            const d = code.split('').map(Number); let b = '101';
            for (let i = 1; i <= 6; i++) b += (P[d[0]][i - 1] === 'L' ? L : G)[d[i]];
            b += '01010'; for (let i = 7; i <= 12; i++) b += R[d[i]];
            return b + '101';
          }
          function photo(code, sideways) {
            const bits = ean(code), mod = 6, W = 1100, H = 700, x0 = 120, y0 = 200, bh = 260;
            let w = W, h = H; const data = Buffer.alloc(W * H * 4);
            let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
              const i = (y * W + x) * 4, bx = Math.floor((x - x0) / mod);
              const bar = y >= y0 && y < y0 + bh && bx >= 0 && bx < bits.length && bits[bx] === '1';
              const v = Math.max(0, Math.min(255, (bar ? 35 : 228) + (rnd() - 0.5) * 50));   // grey card, sensor noise
              data[i] = v; data[i + 1] = v * 0.97; data[i + 2] = v * 0.92; data[i + 3] = 255;
            }
            if (!sideways) return { data, width: w, height: h };
            const out = Buffer.alloc(W * H * 4);
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) data.copy(out, (x * H + (H - 1 - y)) * 4, (y * W + x) * 4, (y * W + x) * 4 + 4);
            return { data: out, width: H, height: W };
          }
          let ok = true;
          for (const sideways of [false, true]) {
            const code = '5901234123457';
            const b64 = Buffer.from(jpeg.encode(photo(code, sideways), 85).data).toString('base64');
            const r = decodeJpegBase64(b64);
            const pass = r && r.data === code && r.type === 'ean13';
            console.log(sideways ? 'sideways' : 'upright', '->', r, pass ? 'OK' : 'FAIL');
            ok = ok && pass;
          }
          if (!ok) { console.log('::error title=Photo barcode reader::self-test failed'); process.exit(1); }
          console.log('::notice title=Photo barcode reader::self-test passed (upright + sideways EAN-13)');
          TAPPASS_EOF
          cat > billing.js <<'TAPPASS_EOF'
          // Google Play subscriptions (expo-iap / Play Billing 9).
          // Play Console: subscription "tappass_pro" with base plans "monthly" and "yearly",
          // each with a 14-day free-trial offer for new customers.
          import * as IAP from 'expo-iap';

          export const SKU = 'tappass_pro';
          const PACKAGE = 'com.cubemobilegames.tappass';
          let connected = null;

          async function connect() {
            if (!connected) connected = IAP.initConnection().catch(e => { connected = null; throw e; });
            return connected;
          }

          const micros = ph => Number(ph?.priceAmountMicros || 0);

          // -> { monthly: {id, price, trial, offerToken}, yearly: {...} } or null when the store has nothing
          export async function loadPlans() {
            await connect();
            const list = await IAP.fetchProducts({ skus: [SKU], type: 'subs' });
            const p = (list || []).find(x => x.id === SKU) || (list || [])[0];
            if (!p) return null;
            const details = p.subscriptionOfferDetailsAndroid || [];
            const plan = id => {
              const offers = details.filter(o => o.basePlanId === id);
              if (!offers.length) return null;
              const base = offers.find(o => !o.offerId) || offers[0];
              const trial = offers.find(o => o.offerId && (o.pricingPhases?.pricingPhaseList || []).some(ph => micros(ph) === 0));
              const phases = base.pricingPhases?.pricingPhaseList || [];
              const paid = phases.filter(ph => micros(ph) > 0);
              const last = paid[paid.length - 1] || phases[phases.length - 1];
              return { id, price: last?.formattedPrice || '', micros: micros(last), trial: !!trial, offerToken: (trial || base).offerToken };
            };
            const out = { monthly: plan('monthly'), yearly: plan('yearly') };
            return out.monthly || out.yearly ? out : null;
          }

          // opens the Google Play purchase sheet; the result arrives in the listener below
          export async function buy(plan) {
            await connect();
            return IAP.requestPurchase({
              request: { google: { skus: [SKU], subscriptionOffers: [{ sku: SKU, offerToken: plan.offerToken }] }, apple: { sku: SKU } },
              type: 'subs',
            });
          }

          const acknowledge = async p => {
            if (p && p.purchaseToken && p.isAcknowledgedAndroid === false) await IAP.finishTransaction({ purchase: p, isConsumable: false });
          };

          // onOk(purchase) when a subscription is bought; onErr(error) unless the user simply cancelled
          export function listen(onOk, onErr) {
            const a = IAP.purchaseUpdatedListener(async p => {
              try {
                if (p.productId !== SKU || p.purchaseState === 'pending') return;
                await acknowledge(p);                  // must happen within 3 days or Google refunds it
                onOk(p);
              } catch (e) { onErr(e); }
            });
            const b = IAP.purchaseErrorListener(e => { if (e && e.code !== 'user-cancelled') onErr(e); });
            return () => { a.remove(); b.remove(); };
          }

          // true / false when the store answered, null when it could not be reached
          export async function hasPro() {
            try {
              await connect();
              const purchases = await IAP.getAvailablePurchases();
              const mine = (purchases || []).filter(p => p.productId === SKU && p.purchaseState === 'purchased');
              for (const p of mine) await acknowledge(p).catch(() => {});
              if (mine.length) return true;
              const subs = await IAP.getActiveSubscriptions([SKU]).catch(() => []);
              return (subs || []).some(s => s.productId === SKU && s.isActive !== false);
            } catch (e) { return null; }
          }

          export async function manage() {
            try { await IAP.deepLinkToSubscriptions({ skuAndroid: SKU, packageNameAndroid: PACKAGE }); return true; } catch (e) { return false; }
          }
          TAPPASS_EOF
