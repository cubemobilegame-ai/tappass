      - name: Generate icons
        run: |
          pip install --quiet pillow numpy
          python3 - <<'TAPPASS_EOF'
          from PIL import Image, ImageDraw
          import numpy as np, math, os
          S=2; N=1024*S
          CX,CY=610,420; RADII=[(45,1.0),(95,.7),(145,.45)]; SW=30; A=48
          bars=[]; x=212
          for w in [14,8,22,10,16,8,24,12,8,20,10,16,8,22,12,10,18,8,14,10]:
              if x+w>600: break
              bars.append((x,w)); x+=w+10
          pt=lambda r,a:(CX+r*math.cos(math.radians(a)),CY+r*math.sin(math.radians(a)))
          def render(k,bg):
              P=lambda x,y:((512+(x-512)*k)*S,(512+(y-512)*k)*S)
              L=lambda v:v*k*S
              if bg:
                  t=np.linspace(0,1,N,dtype=np.float32); d=(t[None,:]+t[:,None])/2
                  c0=np.array([0x2f,0x95,0xff],np.float32); c1=np.array([0x5a,0x3d,0xf0],np.float32)
                  img=Image.fromarray((c0*(1-d[...,None])+c1*d[...,None]).astype(np.uint8),'RGB').convert('RGBA')
              else: img=Image.new('RGBA',(N,N),(0,0,0,0))
              dr=ImageDraw.Draw(img)
              x0,y0=P(162,292); x1,y1=P(862,732); dr.rounded_rectangle([x0,y0,x1,y1],radius=L(64),fill=(255,255,255,255))
              a,b=P(212,342); c,d_=P(362,370); dr.rounded_rectangle([a,b,c,d_],radius=L(14),fill=(0x2f,0x7b,0xff,255))
              for r,o in RADII:
                  lay=Image.new('RGBA',(N,N),(0,0,0,0)); ld=ImageDraw.Draw(lay); rad=L(SW)/2
                  for i in range(0,2*A*4+1):
                      px,py=P(*pt(r,-A+i/4)); ld.ellipse([px-rad,py-rad,px+rad,py+rad],fill=(0x2f,0x7b,0xff,int(255*o)))
                  img=Image.alpha_composite(img,lay)
              dr=ImageDraw.Draw(img)
              for x,w in bars:
                  a,b=P(x,566); c,d_=P(x+w,658); dr.rounded_rectangle([a,b,c,d_],radius=L(2),fill=(0x22,0x30,0x7a,255))
              return img.resize((1024,1024),Image.LANCZOS)
          os.makedirs('assets',exist_ok=True)
          render(1,True).convert('RGB').save('assets/icon.png')
          render(.8,False).save('assets/adaptive-icon.png')
          TAPPASS_EOF

      - name: Restore store database cache
        uses: actions/cache/restore@v4
        with:
          path: storedb-cache.json
          key: storedb-${{ github.run_id }}
          restore-keys: storedb-

      - name: Build store database (All the Places, official store locators)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          cp stores.js /tmp/stores.mjs
          node --input-type=module -e "import('/tmp/stores.mjs').then(m=>{const a=new Set(m.STORES.map(s=>s.n));Object.values(m.GEO_ALIAS).flat().forEach(x=>a.add(x));console.log(JSON.stringify([...a]))})" > /tmp/aliases.json
          URL=$(python3 build_storedb.py /tmp/aliases.json /tmp/unused.json)
          echo "Downloading $URL"
          df -h / /tmp | tail -2
          curl -fL --retry 3 -sS -A "TapPass-build/1.0 (support@tappass.app)" -o /tmp/atp.zip "$URL"
          python3 build_storedb.py /tmp/aliases.json /tmp/storedb.json /tmp/atp.zip | tee /tmp/db.log
          echo "::notice title=Store database::$(grep -E '^(total|spider)' /tmp/db.log | tr '\n' ' ')"
          echo "::notice title=Store counts::$(grep -vE '^(total|spider)' /tmp/db.log | tr '\n' ';' | cut -c1-3000)"
          rm -f /tmp/atp.zip
          cp /tmp/storedb.json storedb-cache.json

      - name: Use store database
        run: |
          mkdir -p assets
          if [ -s storedb-cache.json ]; then cp storedb-cache.json assets/storedb.json; else echo '{}' > assets/storedb.json; echo "::warning title=Store database::empty - app will use online lookup only"; fi
          ls -la assets/storedb.json

      - name: Save store database cache
        if: hashFiles('storedb-cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: storedb-cache.json
          key: storedb-${{ github.run_id }}

      - name: Install dependencies
        run: |
          npm install
          npx expo install expo-location expo-task-manager expo-notifications expo-camera expo-image-picker expo-brightness expo-battery @react-native-async-storage/async-storage react-native-svg react-native-safe-area-context expo-linear-gradient expo-font expo-status-bar
          npm install react-native-qrcode-svg jsbarcode @expo-google-fonts/plus-jakarta-sans

      - name: Create .env (EXPO_PUBLIC_* trafia do aplikacji = publiczne)
        run: |
          echo "EXPO_PUBLIC_DEV_TOOLS=${{ vars.EXPO_PUBLIC_DEV_TOOLS || '1' }}" >> .env
          echo "EXPO_PUBLIC_OVERPASS_URL=${{ secrets.EXPO_PUBLIC_OVERPASS_URL }}" >> .env

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Decode keystore (only if secret exists)
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/*.apk tappass.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TapPass build ${{ github.run_number }}
          prerelease: true
          files: tappass.apk
